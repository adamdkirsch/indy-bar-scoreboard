<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Indy's Not For Profit Bar</title>
<style>
  :root{
    --bg:#07111c;
    --panel:#101b27;
    --panel2:#0b1520;
    --line:#33475b;
    --text:#f5f8fb;
    --muted:#94a7b8;
    --blue:#8fc7f2;
    --live:#ff5a62;
  }

  *{box-sizing:border-box}

  html,body{
    width:100%;
    height:100%;
    margin:0
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;
  }

  .app{
    width:100vw;
    height:100vh;
    min-height:650px;
    padding:1.7vh 1.5vw 1.2vh;
    display:grid;
    grid-template-rows:12.5vh 27vh 1fr 4.2vh;
    gap:1.5vh;
    background:radial-gradient(circle at 50% -15%,#17344d 0%,#07111c 46%,#050c13 100%);
  }

  .topbar{
    display:grid;
    grid-template-columns:25fr 45fr 30fr;
    gap:.8vw;
    min-height:0;
    width:100%
  }

  .topbox,.brandbox,.section,.footer{
    background:linear-gradient(180deg,rgba(18,31,45,.96),rgba(9,20,31,.96));
    border:1px solid var(--line);
    border-radius:.75vw;
  }

  .topbox{
    padding:1.2vh 1.05vw;
    display:flex;
    flex-direction:column;
    justify-content:center
  }

  .brandbox{
    padding:1.2vh 1.2vw;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    text-align:right
  }

  .date{
    font-size:1.0vw;
    color:#b5c2ce;
    font-weight:750;
    letter-spacing:.03em
  }

  .time{
    font-size:2.9vw;
    font-weight:850;
    line-height:1;
    margin-top:.45vh;
    letter-spacing:-.03em
  }

  .weatherBox{
    --weather-rgb:143,199,242;
    position:relative;
    overflow:hidden;
    border-color:rgba(var(--weather-rgb),.42);
    background:
      radial-gradient(circle at 22% 40%,rgba(var(--weather-rgb),.13),transparent 42%),
      linear-gradient(180deg,rgba(18,31,45,.96),rgba(9,20,31,.96));
  }

  .weatherBox::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:.28vh;
    background:rgb(var(--weather-rgb));
    opacity:.72;
  }

  .weatherRow{
    display:flex;
    align-items:center;
    gap:1vw;
    position:relative;
    z-index:1
  }

  .weatherIcon{
    font-size:2.3vw;
    width:2.9vw;
    text-align:center;
    filter:drop-shadow(0 0 .35vw rgba(var(--weather-rgb),.35))
  }

  .temp{
    font-size:2.65vw;
    font-weight:850;
    line-height:1;
    text-shadow:0 0 .75vw rgba(var(--weather-rgb),.28)
  }

  .weatherCity{
    font-size:1.1vw;
    font-weight:800
  }

  .weatherText{
    font-size:.92vw;
    color:#c1cbd4;
    margin-top:.25vh
  }

  .hourly{
    display:flex;
    gap:1.0vw;
    margin-top:.62vh;
    color:#9fb0bf;
    font-size:.69vw;
    white-space:nowrap;
    position:relative;
    z-index:1
  }

  .sunLine{
    display:flex;
    gap:1vw;
    margin-top:.45vh;
    font-size:.64vw;
    color:#9fb0bf;
    position:relative;
    z-index:1
  }

  .sunStatus{
    font-weight:900;
    color:#e8bd72;
    letter-spacing:.06em
  }

  .brandMain{
    font-size:1.3vw;
    font-weight:850;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#d8e8f6
  }

  .brandSub{
    font-size:.68vw;
    color:#7f95a8;
    margin-top:.45vh;
    letter-spacing:.18em;
    text-transform:uppercase
  }

  .section{
    padding:1.05vh .9vw;
    min-height:0
  }

  .favoritesSection{
    display:grid;
    grid-template-rows:auto 1fr;
    min-height:0
  }

  .sectionHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:.8vh
  }

  .sectionTitle{
    font-size:.9vw;
    text-transform:uppercase;
    letter-spacing:.18em;
    color:#b8c5d1;
    font-weight:850
  }

  .sectionNote{
    font-size:.68vw;
    color:#7f95a8
  }

  .teamGrid{
    display:grid;
    grid-template-columns:repeat(var(--team-count,5),calc((100% - 2.75vw)/6));
    justify-content:center;
    gap:.55vw;
    min-height:0;
    height:auto;
    padding-bottom:.08vh
  }

  .teamCard{
    --team-rgb:143,199,242;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(
        180deg,
        rgba(var(--team-rgb),.26) 0%,
        rgba(var(--team-rgb),.12) 38%,
        rgba(8,18,28,.98) 100%
      );
    border:1px solid rgba(var(--team-rgb),.55);
    border-radius:.62vw;
    padding:1vh .72vw .85vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    text-align:center;
    min-width:0;
  }

  .teamCard::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(var(--team-rgb),.08),transparent 45%);
    pointer-events:none;
  }

  .teamCard::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:.32vh;
    background:rgb(var(--team-rgb));
    opacity:.9;
    pointer-events:none;
  }

  .teamCard.women{
    background:
      linear-gradient(
        180deg,
        rgba(246,243,234,.94) 0%,
        rgba(230,226,216,.90) 48%,
        rgba(20,27,34,.96) 100%
      );
    border-color:rgba(var(--team-rgb),.80);
  }

  .teamCard.women .teamName,
  .teamCard.women .match{
    color:#17212b
  }

  .teamCard.women .league{
    color:#4f5c68
  }

  .teamCard.women .badge{
    color:#25303a;
    border-color:rgba(var(--team-rgb),.5);
    background:rgba(255,255,255,.46)
  }

  .teamCard.women .bigScore{
    color:#111a22;
    text-shadow:0 1px 0 rgba(255,255,255,.35)
  }

  .teamCard.women .detail{
    color:#384653
  }

  .teamCard.women .network{
    color:rgb(var(--team-rgb))
  }

  .teamCard.women .teamLogoWrap{
    background:rgba(255,255,255,.76)
  }

  .teamCard.live{
    border:2px solid rgba(var(--team-rgb),.92);
    box-shadow:
      0 0 .72vw rgba(var(--team-rgb),.42),
      inset 0 0 1vw rgba(var(--team-rgb),.10);
  }

  .teamHeader{
    position:relative;
    display:grid;
    grid-template-columns:3.0vw 1fr 3.0vw;
    align-items:start;
    gap:.35vw;
    min-height:4.0vh
  }

  .teamLogoWrap{
    width:3vw;
    height:3vw;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(245,248,251,.92);
    border-radius:.48vw;
    padding:.22vw
  }

  .teamLogo{
    max-width:2.65vw;
    max-height:2.65vw;
    object-fit:contain;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))
  }

  .teamIdentity{
    min-width:0;
    padding-top:.15vh
  }

  .teamName{
    font-size:.88vw;
    font-weight:900;
    line-height:1.05;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
  }

  .league{
    font-size:.61vw;
    color:#8fa2b4;
    margin-top:.3vh;
    text-transform:uppercase;
    letter-spacing:.1em
  }

  .sportMark{
    display:inline-block;
    margin-left:.32vw;
    padding:.12vh .27vw;
    border-radius:.25vw;
    border:1px solid currentColor;
    font-size:.54vw;
    font-weight:950;
    letter-spacing:.08em;
    vertical-align:.05em
  }

  .badge{
    justify-self:end;
    font-size:.58vw;
    padding:.27vh .38vw;
    border-radius:999px;
    border:1px solid #405266;
    color:#9cadbc;
    white-space:nowrap;
    font-weight:800;
    letter-spacing:.04em
  }

  .badge.live{
    color:#fff;
    border-color:rgba(var(--team-rgb),.75);
    background:rgba(var(--team-rgb),.18)
  }

  .liveDot{
    display:inline-block;
    width:.38vw;
    height:.38vw;
    min-width:5px;
    min-height:5px;
    border-radius:50%;
    background:var(--live);
    margin-right:.22vw;
    vertical-align:.03em;
    box-shadow:0 0 .35vw rgba(255,90,98,.55)
  }

  .match{
    position:relative;
    font-size:.9vw;
    font-weight:800;
    color:#d7e0e8;
    margin-top:.35vh;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
  }

  .bigScore{
    position:relative;
    font-size:1.85vw;
    font-weight:900;
    line-height:1.03;
    letter-spacing:-.03em;
    margin:.3vh 0
  }

  .meta{
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:.45vw;
    text-align:left
  }

  .detail{
    font-size:.72vw;
    color:#9dafbf;
    line-height:1.25
  }

  .network{
    font-size:.78vw;
    font-weight:950;
    color:var(--blue);
    letter-spacing:.05em;
    margin-top:.35vh;
    text-align:right;
    white-space:nowrap
  }

  .emptyTeams{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8195a7;
    font-size:1vw;
    border:1px dashed #33475b;
    border-radius:.62vw
  }

  .main{
    min-height:0;
    display:grid;
    grid-template-columns:1.7fr .9fr;
    gap:.8vw
  }

  .aroundSection,
  .comingSection{
    overflow:hidden
  }

  .aroundSection{
    display:grid;
    grid-template-rows:auto 1fr
  }

  .gameList{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-rows:repeat(6,minmax(0,1fr));
    grid-auto-flow:column;
    gap:.62vh .55vw;
    min-height:0;
    height:100%;
  }

  .gameCard{
    background:#0b1621;
    border:1px solid #2f4254;
    border-radius:.55vw;
    padding:.52vh .5vw;
    min-height:0;
    display:grid;
    grid-template-columns:2.0vw 1fr;
    gap:.42vw;
    align-items:center;
    overflow:hidden;
  }

  .gameCard.live{
    border-color:rgba(143,199,242,.88);
    box-shadow:
      0 0 .6vw rgba(143,199,242,.24),
      inset 0 0 .8vw rgba(143,199,242,.06)
  }

  .leagueLogoWrap{
    width:1.8vw;
    height:1.8vw;
    border-radius:.36vw;
    background:rgba(245,248,251,.92);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:.17vw;
    overflow:hidden
  }

  .leagueLogo{
    max-width:1.5vw;
    max-height:1.5vw;
    object-fit:contain
  }

  .leagueLogoFallback{
    display:none;
    font-size:.4vw;
    font-weight:950;
    color:#162331;
    text-align:center;
    line-height:1
  }

  .matchupBox{
    min-width:0
  }

  .scoreboardLine{
    display:grid;
    grid-template-columns:1.7vw minmax(0,1fr) 1.55vw .38vw 1.55vw minmax(0,1fr) 1.7vw;
    gap:.22vw;
    align-items:center;
    min-width:0;
  }

  .aroundTeamLogoWrap{
    width:1.55vw;
    height:1.55vw;
    border-radius:.31vw;
    background:rgba(245,248,251,.94);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:.12vw;
    overflow:hidden
  }

  .aroundTeamLogo{
    max-width:1.32vw;
    max-height:1.32vw;
    object-fit:contain
  }

  .aroundTeamLogoFallback{
    display:none;
    font-size:.38vw;
    font-weight:950;
    color:#162331;
    text-align:center;
    line-height:1
  }

  .aroundTeam{
    font-size:.7vw;
    font-weight:820;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:#d7e0e8
  }

  .aroundTeam.home{
    text-align:right
  }

  .aroundScore{
    font-size:1.12vw;
    font-weight:780;
    text-align:center;
    color:#aebbc6;
    line-height:1
  }

  .aroundScore.leader{
    font-size:1.2vw;
    font-weight:950;
    color:#fff;
    text-shadow:0 0 .32vw rgba(255,255,255,.12)
  }

  .scoreDash{
    font-size:.72vw;
    color:#617689;
    text-align:center;
    font-weight:700
  }

  .aroundStart{
    grid-column:3 / 6;
    text-align:center;
    font-size:1.02vw;
    font-weight:950;
    color:#fff;
    white-space:nowrap
  }

  .gameMeta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.45vw;
    margin-top:.28vh;
    min-width:0
  }

  .gameContext{
    font-size:.59vw;
    color:#c5d1db;
    font-weight:760;
    letter-spacing:.012em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
  }

  .gameContext .aroundLive{
    color:#fff;
    font-weight:950
  }

  .gameContext .aroundLive .liveDot{
    margin-right:.15vw
  }

  .gameNetwork{
    font-size:.6vw;
    font-weight:950;
    color:var(--blue);
    white-space:nowrap
  }

  .comingList{
    display:flex;
    flex-direction:column;
    gap:.55vh
  }

  .comingItem{
    display:grid;
    grid-template-columns:2.55vw 3.2vw 1fr auto;
    gap:.55vw;
    align-items:center;
    padding:.7vh .65vw;
    border:1px solid #2f4254;
    border-radius:.5vw;
    background:#0b1621
  }

  .comingLogoWrap{
    width:2.35vw;
    height:2.35vw;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(245,248,251,.92);
    border-radius:.42vw;
    padding:.18vw;
    overflow:hidden
  }

  .comingLogo{
    max-width:2.02vw;
    max-height:2.02vw;
    object-fit:contain
  }

  .comingLogoFallback{
    display:none;
    font-size:.5vw;
    font-weight:950;
    color:#162331;
    text-align:center;
    line-height:1
  }

  .comingTime{
    font-weight:950;
    font-size:.8vw
  }

  .comingTeams{
    font-size:.88vw;
    font-weight:850;
    line-height:1.15
  }

  .comingNetwork{
    font-size:.78vw;
    font-weight:950;
    color:var(--blue);
    white-space:nowrap
  }

  .tiny{
    font-size:.68vw;
    color:#9aabba;
    margin-top:.2vh;
    font-weight:700
  }

  .phaseMsg{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#7890a3;
    font-size:.86vw;
    line-height:1.5;
    padding:2vw
  }

  .footer{
    padding:.6vh .8vw;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:1vw
  }

  .footerLeft{
    font-size:.65vw;
    color:#73899b;
    letter-spacing:.05em
  }

  .footerRight{
    font-size:.72vw;
    font-weight:850;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#a9b9c6
  }

  @media(max-width:1100px){
    .app{min-height:560px}
    .teamName{font-size:1vw}
    .match{font-size:1vw}
    .detail,.network{font-size:.78vw}
  }

  .logoFallback{
    width:2.65vw;
    height:2.65vw;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:.72vw;
    font-weight:900;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:#fff
  }
</style>
</head>

<div class="app">

  <div class="topbar">

    <div class="topbox">
      <div class="date" id="dateLine">—</div>
      <div class="time" id="timeLine">—</div>
    </div>

    <div class="topbox weatherBox" id="weatherBox">

      <div class="sunLine">

    </div>

    <div class="brandbox">
      <div>

        <div class="brandSub">Sports · Weather · What’s On</div>
      </div>
    </div>

  </div>


  <section class="favoritesSection">

    <div class="sectionHeader">
      <div class="sectionTitle">Your Teams</div>
    </div>

    <div class="teamGrid" id="teamGrid"></div>

  </section>


  <div class="main">

    <section class="section aroundSection">

      <div class="sectionHeader">
        <div class="sectionTitle" id="aroundTitle">Around Sports</div>
        <div class="sectionNote">What matters now</div>
      </div>

      <div class="gameList" id="gameList"></div>

    </section>


    <section class="section comingSection">

      <div class="sectionHeader">
        <div class="sectionTitle">On Deck</div>
      </div>

      <div class="comingList" id="comingList"></div>

    </section>

  </div>


  <div class="footer">

    <div class="footerLeft" id="footerLeft">
      Weather: Open-Meteo · Favorites: ESPN · Around Sports: ESPN + NCAA · Refreshes automatically
    </div>

    <div class="footerRight">
      You’re a Stranger Here But Once.
    </div>

  </div>

</div>

function fmtDate(d){

  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone:TZ,
      weekday:'long',
      month:'long',
      day:'numeric',
      year:'numeric'
    }
  ).format(d);
}


function fmtTime(d){

  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone:TZ,
      hour:'numeric',
      minute:'2-digit'
    }
  ).format(d);
}


function fmtShortDateTime(d){

  const now=new Date();

  const day=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        weekday:'short'
      }
    ).format(d);

  const time=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        hour:'numeric',
        minute:'2-digit'
      }
    ).format(d);

  const md=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        month:'short',
        day:'numeric'
      }
    ).format(d);

  const sameDay=
    new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).format(d)===
    new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).format(now);

  if(sameDay)
    return `Today · ${time}`;

  const tomorrow=
    new Date(
      now.getTime()+
      86400000
    );

  const isTomorrow=
    new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).format(d)===
    new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).format(tomorrow);

  if(isTomorrow)
    return `Tomorrow · ${time}`;

  return `${day}, ${md} · ${time}`;
}

function weatherLabel(code){

  if(code===0)
    return ['Clear','☀'];

  if([1,2].includes(code))
    return ['Partly Cloudy','⛅'];

  if(code===3)
    return ['Cloudy','☁'];

  if([45,48].includes(code))
    return ['Fog','≋'];

  if([51,53,55,56,57].includes(code))
    return ['Drizzle','🌦'];

  if([61,63,65,66,67,80,81,82].includes(code))
    return ['Rain','🌧'];

  if([71,73,75,77,85,86].includes(code))
    return ['Snow','❄'];

  if([95,96,99].includes(code))
    return ['Thunderstorms','⛈'];

  return ['Conditions','◌'];
}


function weatherAccent(code){

  if(code===0)
    return '232,190,88';

  if(
    [1,2,3,45,48]
    .includes(code)
  )
    return '151,181,205';

  if(
    [
      51,53,55,56,57,
      61,63,65,66,67,
      80,81,82
    ].includes(code)
  )
    return '74,153,211';

  if(
    [
      71,73,75,77,
      85,86
    ].includes(code)
  )
    return '176,220,239';

  if(
    [95,96,99]
    .includes(code)
  )
    return '150,123,213';

  return '143,199,242';
}


function indyClockMinutes(){

  const parts=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        hour:'2-digit',
        minute:'2-digit',
        hour12:false
      }
    ).formatToParts(
      new Date()
    );

  const o=
    Object.fromEntries(
      parts.map(
        p=>[
          p.type,
          p.value
        ]
      )
    );

  return Number(o.hour)*60+
    Number(o.minute);
}


function localIsoMinutes(iso){

  const m=
    String(iso||'')
    .match(
      /T(\d{2}):(\d{2})/
    );

  return m
    ? Number(m[1])*60+
      Number(m[2])
    : null;
}


function formatLocalIsoTime(iso){

  const mins=
    localIsoMinutes(iso);

  if(mins==null)
    return '—';

  let h=
    Math.floor(
      mins/60
    );

  const m=
    mins%60;

  const suffix=
    h>=12
      ? 'PM'
      : 'AM';

  const h12=
    h%12||
    12;

  return `${h12}:${String(m).padStart(2,'0')} ${suffix}`;
}


async function loadWeather(){

  try{

    const url=
      'https://api.open-meteo.com/v1/forecast?latitude=39.7684&longitude=-86.1581&current=temperature_2m,apparent_temperature,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&daily=sunrise,sunset&temperature_unit=fahrenheit&timezone=America%2FIndiana%2FIndianapolis&forecast_days=2';

    const r=
      await fetch(
        url,
        {
          cache:'no-store'
        }
      );

    if(!r.ok)
      throw new Error(
        'weather'
      );

    const w=
      await r.json();

    const [label,icon]=
      weatherLabel(
        w.current.weather_code
      );

    document
      .getElementById('weatherBox')
      .style
      .setProperty(
        '--weather-rgb',
        weatherAccent(
          w.current.weather_code
        )
      );

    document
      .getElementById('temp')
      .textContent=
        `${Math.round(w.current.temperature_2m)}°`;

    document
      .getElementById('weatherIcon')
      .textContent=
        icon;

    document
      .getElementById('weatherText')
      .textContent=
        `${label} · Feels like ${Math.round(w.current.apparent_temperature)}°`;

    const now=
      Date.now();

    const points=[];

    for(
      let i=0;
      i<w.hourly.time.length &&
      points.length<4;
      i++
    ){

      const x=
        new Date(
          w.hourly.time[i]
        );

      if(
        x.getTime()>now
      ){

        points.push({
          t:x,
          temp:
            w.hourly.temperature_2m[i],
          rain:
            w.hourly.precipitation_probability[i]
        });
      }
    }

    document
      .getElementById('hourly')
      .innerHTML=
        points.map(
          (p,i)=>{

            const h=
              new Intl.DateTimeFormat(
                'en-US',
                {
                  timeZone:TZ,
                  hour:'numeric'
                }
              ).format(
                p.t
              );

            return `<span>${h} ${Math.round(p.temp)}°${i===0 && p.rain!=null ? ` · Rain ${p.rain}%` : ''}</span>`;
          }
        ).join('');

    const rise=
      w.daily?.sunrise?.[0];

    const set=
      w.daily?.sunset?.[0];

    document
      .getElementById('sunrise')
      .textContent=
        `Sunrise ${formatLocalIsoTime(rise)}`;

    document
      .getElementById('sunset')
      .textContent=
        `Sunset ${formatLocalIsoTime(set)}`;

    const n=
      indyClockMinutes();

    const rmin=
      localIsoMinutes(rise);

    const smin=
      localIsoMinutes(set);

    const up=
      rmin!=null &&
      smin!=null &&
      n>=rmin &&
      n<smin;

    document
      .getElementById('sunStatus')
      .textContent=
        up
          ? '☀ SUN UP'
          : '☾ SUN DOWN';

  }catch(e){

    document
      .getElementById('weatherText')
      .textContent=
        'Weather temporarily unavailable';

    document
      .getElementById('hourly')
      .innerHTML='';
  }
}


function competition(ev){

  return ev?.competitions?.[0]||
    {};
}


function eventDate(ev){

  return new Date(
    ev?.date||
    competition(ev)?.date||
    0
  );
}


function eventState(ev){

  return (
    competition(ev)?.status?.type?.state||
    ev?.status?.type?.state||
    ''
  );
}


function isCompleted(ev){

  return !!(
    competition(ev)?.status?.type?.completed||
    ev?.status?.type?.completed
  );
}


function findCompetitor(ev,id){

  return (
    competition(ev).competitors||
    []
  ).find(
    c=>
      String(c.team?.id)===
      String(id)
  );
}


function otherCompetitor(ev,id){

  return (
    competition(ev).competitors||
    []
  ).find(
    c=>
      String(c.team?.id)!==
      String(id)
  );
}


function scoreValue(c){

  return typeof c?.score==='object'
    ? (
        c.score.displayValue??
        c.score.value??
        ''
      )
    : (
        c?.score??
        ''
      );
}


function statusText(ev){

  return (
    competition(ev)?.status?.type?.shortDetail||
    competition(ev)?.status?.type?.detail||
    ev?.status?.type?.shortDetail||
    ''
  );
}


function isSaneLive(ev){

  if(
    eventState(ev)!=='in'
  )
    return false;

  const start=
    eventDate(ev)
    .getTime();

  if(!start)
    return false;

  const delta=
    (
      Date.now()-
      start
    )/
    3600000;

  return (
    delta>=-1 &&
    delta<=LIVE_SANITY_HOURS
  );
}


function isRecentFinal(
  ev,
  hours=6
){

  if(!isCompleted(ev))
    return false;

  const start=
    eventDate(ev)
    .getTime();

  if(!start)
    return false;

  return (
    Date.now()-start>=0 &&
    Date.now()-start<=
    hours*3600000
  );
}


function isUpcomingWithin(
  ev,
  days=ACTIVE_WINDOW_DAYS
){

  if(
    isCompleted(ev)||
    eventState(ev)==='in'
  )
    return false;

  const when=
    eventDate(ev)
    .getTime();

  return (
    when>=Date.now()-3600000 &&
    when<=Date.now()+days*86400000
  );
}


function indyMonth(){

  return Number(
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        month:'numeric'
      }
    ).format(
      new Date()
    )
  );
}


function footballSeasonActive(team){

  if(
    team?.sport!=='football'
  )
    return false;

  const month=
    indyMonth();

  if(team.league==='nfl')
    return (
      month>=8||
      month<=2
    );

  return (
    month>=8||
    month<=1
  );
}


function isEligibleUpcoming(
  ev,
  team
){

  if(
    isCompleted(ev)||
    eventState(ev)==='in'
  )
    return false;

  const when=
    eventDate(ev)
    .getTime();

  if(
    !when||
    when<Date.now()-3600000
  )
    return false;

  if(
    footballSeasonActive(team)
  )
    return true;

  return isUpcomingWithin(
    ev,
    ACTIVE_WINDOW_DAYS
  );
}


function networkOf(ev){

  if(ev?._resolvedNetwork)
    return ev._resolvedNetwork;

  const arr=
    competition(ev).broadcasts||
    ev?.broadcasts||
    [];

  const names=[];

  for(
    const b of arr
  ){

    for(
      const n of b.names||
      []
    )
      names.push(n);

    if(b.name)
      names.push(
        b.name
      );

    if(
      b.market?.type &&
      b.media?.shortName
    )
      names.push(
        b.media.shortName
      );
  }

  const unique=
    [
      ...new Set(
        names.filter(Boolean)
      )
    ];

  return unique
    .slice(0,2)
    .join(' / ')||
    'TV TBD';
}


function opponentText(
  ev,
  id
){

  const me=
    findCompetitor(
      ev,
      id
    );

  const opp=
    otherCompetitor(
      ev,
      id
    );

  if(!opp)
    return '';

  const prefix=
    me?.homeAway==='home'
      ? 'vs.'
      : 'at';

  return `${prefix} ${opp.team?.shortDisplayName || opp.team?.displayName || opp.team?.name || 'Opponent'}`;
}


function extractRecord(
  recordJson,
  teamJson
){

  const candidates=[];

  function walkItems(items){

    if(
      !Array.isArray(items)
    )
      return;

    for(
      const item of items
    ){

      if(item?.summary)
        candidates.push({
          summary:item.summary,
          type:
            item.type||
            item.name||
            ''
        });

      if(
        item?.displayValue &&
        /overall|total/i
        .test(
          item?.name||
          item?.type||
          ''
        )
      )
        candidates.push({
          summary:item.displayValue,
          type:
            item.type||
            item.name||
            ''
        });

      if(item?.stats){

        const statMap={};

        for(
          const s of item.stats
        ){

          statMap[
            (
              s.name||
              s.abbreviation||
              ''
            ).toLowerCase()
          ]=
            s.value??
            s.displayValue;
        }

        const wins=
          statMap.wins??
          statMap.w;

        const losses=
          statMap.losses??
          statMap.l;

        const ties=
          statMap.ties??
          statMap.t;

        if(
          wins!=null &&
          losses!=null
        )
          candidates.push({
            summary:
              `${wins}-${losses}${ties ? `-${ties}` : ''}`,
            type:
              item.type||
              item.name||
              ''
          });
      }
    }
  }

  walkItems(
    recordJson?.items
  );

  walkItems(
    recordJson?.record?.items
  );

  walkItems(
    recordJson?.team?.record?.items
  );

  walkItems(
    teamJson?.team?.record?.items
  );

  if(
    teamJson?.team?.recordSummary
  )
    candidates.push({
      summary:
        teamJson.team.recordSummary,
      type:'overall'
    });

  const preferred=
    candidates.find(
      x=>
        /overall|total/i
        .test(
          x.type
        )
    )||
    candidates[0];

  return preferred?.summary||
    '';
}

async function fetchJson(url){

  const r=
    await fetch(
      url,
      {
        cache:'no-store'
      }
    );

  if(!r.ok)
    throw new Error(
      `${r.status} ${url}`
    );

  return r.json();
}


async function fallbackNetworkForEvent(
  t,
  ev
){

  if(
    !ev?.id||
    networkOf(ev)!=='TV TBD'
  )
    return networkOf(ev);

  const cached=
    broadcastCache.get(
      String(ev.id)
    );

  if(
    cached &&
    Date.now()-cached.at<
    BROADCAST_CACHE_MS
  )
    return cached.network;

  try{

    const data=
      await fetchJson(
        `${ESPN_BASE}/${t.sport}/${t.league}/summary?event=${ev.id}`
      );

    const headerEvent={
      competitions:
        data?.header?.competitions||
        []
    };

    const network=
      networkOf(
        headerEvent
      );

    broadcastCache.set(
      String(ev.id),
      {
        at:Date.now(),
        network
      }
    );

    return network;

  }catch(e){

    broadcastCache.set(
      String(ev.id),
      {
        at:Date.now(),
        network:'TV TBD'
      }
    );

    return 'TV TBD';
  }
}


async function fetchTeamBundle(t){

  const base=
    `${ESPN_BASE}/${t.sport}/${t.league}`;

  const [
    scheduleRes,
    teamRes,
    recordRes
  ]=
    await Promise.allSettled([

      fetchJson(
        `${base}/teams/${t.teamId}/schedule`
      ),

      fetchJson(
        `${base}/teams/${t.teamId}`
      ),

      fetchJson(
        `${base}/teams/${t.teamId}/record`
      )

    ]);

  if(
    scheduleRes.status!==
    'fulfilled'
  )
    throw scheduleRes.reason;

  const schedule=
    scheduleRes.value;

  const teamJson=
    teamRes.status==='fulfilled'
      ? teamRes.value
      : {};

  const recordJson=
    recordRes.status==='fulfilled'
      ? recordRes.value
      : {};

  const events=
    schedule.events||
    [];

  const relevant=
    events
      .filter(
        e=>
          isSaneLive(e)||
          isRecentFinal(
            e,
            t.recentFinalHours??
            6
          )||
          isEligibleUpcoming(
            e,
            t
          )
      )
      .sort(
        (a,b)=>
          eventDate(a)-
          eventDate(b)
      )
      .slice(
        0,
        3
      );

  await Promise.all(
    relevant.map(
      async e=>{

        if(
          networkOf(e)===
          'TV TBD'
        ){

          const n=
            await fallbackNetworkForEvent(
              t,
              e
            );

          if(
            n &&
            n!=='TV TBD'
          )
            e._resolvedNetwork=n;
        }
      }
    )
  );

  return {
    team:t,
    events,
    teamJson,
    recordJson,
    record:
      extractRecord(
        recordJson,
        teamJson
      ),
    logo:
      teamLogo(
        teamJson,
        t
      )
  };
}


function chooseDisplayEvent(
  events,
  team
){

  const valid=
    (events||[])
    .filter(
      e=>
        eventDate(e)
        .getTime()>0
    );

  const live=
    valid
      .filter(
        isSaneLive
      )
      .sort(
        (a,b)=>
          eventDate(a)-
          eventDate(b)
      )[0];

  if(live)
    return {
      event:live,
      kind:'live'
    };

  const recentFinal=
    valid
      .filter(
        e=>
          isRecentFinal(
            e,
            team?.recentFinalHours??
            6
          )
      )
      .sort(
        (a,b)=>
          eventDate(b)-
          eventDate(a)
      )[0];

  if(recentFinal)
    return {
      event:recentFinal,
      kind:'final'
    };

  const next=
    valid
      .filter(
        e=>
          isEligibleUpcoming(
            e,
            team
          )
      )
      .sort(
        (a,b)=>
          eventDate(a)-
          eventDate(b)
      )[0];

  if(next)
    return {
      event:next,
      kind:'upcoming'
    };

  return null;
}


function buildCard(bundle){

  const chosen=
    chooseDisplayEvent(
      bundle.events,
      bundle.team
    );

  if(!chosen)
    return null;

  const t=
    bundle.team;

  const ev=
    chosen.event;

  const me=
    findCompetitor(
      ev,
      t.teamId
    );

  const opp=
    otherCompetitor(
      ev,
      t.teamId
    );

  const isLive=
    chosen.kind==='live';

  let headline='';

  if(
    isLive||
    chosen.kind==='final'
  )
    headline=
      `${scoreValue(me)} – ${scoreValue(opp)}`;

  else
    headline=
      fmtTime(
        eventDate(ev)
      );

  let detail='';

  if(
    isLive||
    chosen.kind==='final'
  )
    detail=
      statusText(ev);

  else
    detail=
      fmtShortDateTime(
        eventDate(ev)
      );

  return {
    t,
    ev,
    isLive,
    kind:chosen.kind,
    record:bundle.record,
    logo:bundle.logo,
    badge:
      isLive
        ? '<span class="liveDot"></span>LIVE'
        : (
            chosen.kind==='final'
              ? 'FINAL'
              : 'NEXT'
          ),
    match:
      opponentText(
        ev,
        t.teamId
      ),
    headline,
    detail,
    network:
      networkOf(ev)
  };
}


function renderTeamCards(cards){

  grid.innerHTML='';

  if(!cards.length){

  grid.className=

    .setProperty(

function renderOnDeck(
  bundles,
  allCards,
  displayedCards
){

  const list=
    document
      .getElementById(
        'comingList'
      );

  list.innerHTML='';

  const displayedEvents=
    new Set(
      displayedCards.map(
        c=>
          String(
            c.ev?.id||
            ''
          )
      )
    );

  const items=[];
  const seen=new Set();


  for(
    const c of allCards.slice(6)
  ){

    const id=
      `${c.t.key}:${c.ev?.id||eventDate(c.ev).getTime()}`;

    if(
      seen.has(id)
    )
      continue;

    seen.add(id);

    items.push({
      type:'overflow',
      t:c.t,
      e:c.ev,
      kind:c.kind,
      isLive:c.isLive,
      logo:c.logo
    });
  }


  const now=
    Date.now();

  const week=
    now+
    7*86400000;

  const upcoming=[];

  for(
    const b of bundles
  ){

    for(
      const e of b.events
    ){

      const when=
        eventDate(e)
        .getTime();

      if(
        isCompleted(e)||
        isSaneLive(e)||
        when<now-3600000||
        when>week
      )
        continue;

      if(
        displayedEvents.has(
          String(
            e.id||
            ''
          )
        )
      )
        continue;

      const id=
        `${b.team.key}:${e.id||when}`;

      if(
        seen.has(id)
      )
        continue;

      seen.add(id);

      upcoming.push({
        type:'upcoming',
        t:b.team,
        e,
        kind:'upcoming',
        isLive:false,
        logo:b.logo
      });
    }
  }

  upcoming.sort(
    (a,b)=>
      eventDate(a.e)-
      eventDate(b.e)
  );

  items.push(
    ...upcoming
  );

  if(!items.length){

    list.innerHTML=
      '<div class="phaseMsg">Nothing else scheduled for your teams in the next seven days.</div>';

    return;
  }

  for(
    const x of items.slice(0,7)
  ){

    const d=
      eventDate(x.e);

    const div=
      document.createElement(
        'div'
      );

    div.className=
      'comingItem';

    let left='';

    if(
      x.kind==='live'
    )
      left='LIVE';

    else if(
      x.kind==='final'
    )
      left='FINAL';

    else
      left=
        new Intl.DateTimeFormat(
          'en-US',
          {
            timeZone:TZ,
            weekday:'short'
          }
        ).format(d)
        .toUpperCase();

    const sub=
      x.kind==='live'
        ? statusText(x.e)
        : (
            x.kind==='final'
              ? `${statusText(x.e)} · ${fmtShortDateTime(d)}`
              : fmtShortDateTime(d)
          );

    div.innerHTML=`

      <div class="comingLogoWrap">

        <img
          class="comingLogo"
          src="${x.logo||x.t.fallbackLogo}"
          alt="${x.t.name}"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='block';
          "
        >

        <div class="comingLogoFallback">
          ${x.t.short}
        </div>

      </div>


      <div class="comingTime">
        ${left}
      </div>


      <div>

        <div class="comingTeams">
          ${x.t.name}
          ${opponentText(x.e,x.t.teamId)}
        </div>

        <div class="tiny">
          ${sub}
        </div>

      </div>


      <div class="comingNetwork">
        ${networkOf(x.e)}
      </div>
    `;

    list.appendChild(div);
  }
}


function aroundStatusRank(g){

  if(g.state==='live')
    return 0;

  if(g.state==='pre')
    return 1;

  return 2;
}


function normalizeEspnAround(
  event,
  leagueLabel
){

  const c=
    event?.competitions?.[0]||
    {};

  const comps=
    c.competitors||
    [];

  const home=
    comps.find(
      x=>x.homeAway==='home'
    )||
    comps[0]||
    {};

  const away=
    comps.find(
      x=>x.homeAway==='away'
    )||
    comps[1]||
    {};

  const st=
    c.status?.type||
    event?.status?.type||
    {};

  const state=
    st.state==='in'
      ? 'live'
      : (
          st.completed||
          st.state==='post'
            ? 'post'
            : 'pre'
        );

  const rank=x=>{

    const r=
      Number(
        x?.curatedRank?.current||
        x?.team?.rank||
        0
      )||
      0;

    return (
      /^NCAA/.test(leagueLabel) &&
      r>=1 &&
      r<=25
    )
      ? r
      : 0;
  };

  const score=x=>
    Number(
      scoreValue(x)||
      0
    );

  return {

    source:'ESPN',

    league:leagueLabel,

    state,

    date:
      new Date(
        event.date||
        c.date||
        0
      ),

    away:
      away.team?.shortDisplayName||
      away.team?.displayName||
      away.team?.name||
      'Away',

    home:
      home.team?.shortDisplayName||
      home.team?.displayName||
      home.team?.name||
      'Home',

    awayAbbr:
      away.team?.abbreviation||
      away.team?.shortDisplayName||
      'AWAY',

    homeAbbr:
      home.team?.abbreviation||
      home.team?.shortDisplayName||
      'HOME',

    awayLogo:
      away.team?.logo||
      away.team?.logos?.[0]?.href||
      '',

    homeLogo:
      home.team?.logo||
      home.team?.logos?.[0]?.href||
      '',

    awayScore:
      score(away),

    homeScore:
      score(home),

    awayRank:
      rank(away),

    homeRank:
      rank(home),

    status:
      st.shortDetail||
      st.detail||
      '',

    network:
      networkOf(event)
  };
}


function normalizeNcaaAround(
  wrapper,
  leagueLabel
){

  const g=
    wrapper?.game||
    wrapper||
    {};

  const toRank=v=>
    Number(v)||
    0;

  const toScore=v=>
    Number(v)||
    0;

  let dt=null;

  if(
    g.startTimeEpoch
  )
    dt=
      new Date(
        Number(
          g.startTimeEpoch
        )*
        1000
      );

  if(
    !dt||
    !dt.getTime()
  ){

    const raw=
      `${g.startDate||''} ${g.startTime||''}`
      .replace(
        / ET$/,
        ''
      );

    const trial=
      new Date(raw);

    if(
      trial.getTime()
    )
      dt=trial;
  }

  return {

    source:'NCAA',

    league:leagueLabel,

    state:
      g.gameState==='live'
        ? 'live'
        : (
            g.gameState==='final'
              ? 'post'
              : 'pre'
          ),

    date:
      dt||
      new Date(0),

    away:
      g.away?.names?.short||
      g.away?.names?.full||
      'Away',

    home:
      g.home?.names?.short||
      g.home?.names?.full||
      'Home',

    awayAbbr:
      g.away?.names?.char6||
      g.away?.names?.short||
      'AWAY',

    homeAbbr:
      g.home?.names?.char6||
      g.home?.names?.short||
      'HOME',

    awayLogo:
      g.away?.logo||
      '',

    homeLogo:
      g.home?.logo||
      '',

    awaySlug:
      g.away?.names?.seo||
      '',

    homeSlug:
      g.home?.names?.seo||
      '',

    awayScore:
      toScore(
        g.away?.score
      ),

    homeScore:
      toScore(
        g.home?.score
      ),

    awayRank:
      toRank(
        g.away?.rank
      ),

    homeRank:
      toRank(
        g.home?.rank
      ),

    status:
      g.gameState==='live'
        ? `${g.currentPeriod||''}${g.contestClock ? ` · ${g.contestClock}`:''}`.trim()
        : (
            g.finalMessage||
            g.startTime||
            ''
          ),

    network:
      g.network||
      'TV TBD'
  };
}


function aroundImportance(g){

  let pts=0;

  const now=
    Date.now();

  const hours=
    Math.abs(
      g.date.getTime()-
      now
    )/
    3600000;

  if(
    g.state==='live'
  )
    pts+=100;

  else if(
    g.state==='pre'
  )
    pts+=
      Math.max(
        0,
        45-hours*2
      );

  else
    pts+=8;

  const ranked=
    (
      g.awayRank>0
        ? 1
        : 0
    )+
    (
      g.homeRank>0
        ? 1
        : 0
    );

  pts+=
    ranked*18;

  if(
    g.awayRank>0 &&
    g.awayRank<=10
  )
    pts+=9;

  if(
    g.homeRank>0 &&
    g.homeRank<=10
  )
    pts+=9;

  if(
    g.state==='live'
  ){

    const margin=
      Math.abs(
        g.awayScore-
        g.homeScore
      );

    if(
      margin<=3
    )
      pts+=25;

    else if(
      margin<=7
    )
      pts+=16;

    else if(
      margin<=14
    )
      pts+=7;

    if(
      (
        g.awayRank &&
        g.homeScore>
        g.awayScore
      )||
      (
        g.homeRank &&
        g.awayScore>
        g.homeScore
      )
    )
      pts+=14;
  }

  if(
    /playoff|championship|wild card|tournament/i
    .test(
      g.status||
      ''
    )
  )
    pts+=20;

  return pts;
}


function rankLabel(
  rank,
  name
){

  return rank
    ? `#${rank} ${name}`
    : name;
}


function leagueLogoInfo(league){

  const key=
    String(
      league||
      ''
    )
    .toUpperCase();

  if(key==='MLB')
    return {
      src:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png',
      fallback:'',
      label:'MLB'
    };

  if(key==='NFL')
    return {
      src:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png',
      fallback:'',
      label:'NFL'
    };

  if(key==='NBA')
    return {
      src:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png',
      fallback:'',
      label:'NBA'
    };

  if(key==='WNBA')
    return {
      src:'https://a.espncdn.com/i/teamlogos/leagues/500/wnba.png',
      fallback:'',
      label:'WNBA'
    };

  const generic=
    'https://a.espncdn.com/i/teamlogos/leagues/500/ncaa.png';

  if(
    key.includes(
      'FOOTBALL'
    )
  )
    return {
      src:'ncaa-football.png',
      fallback:generic,
      label:'NCAA Football'
    };

  if(
    key.includes(
      'WOMEN'
    )
  )
    return {
      src:'ncaa-womens-basketball.png',
      fallback:generic,
      label:'NCAA Women'
    };

  if(
    key.includes(
      'MEN'
    )
  )
    return {
      src:'ncaa-mens-basketball.png',
      fallback:generic,
      label:'NCAA Men'
    };

  return {
    src:generic,
    fallback:'',
    label:'NCAA'
  };
}


function aroundTeamLogo(
  g,
  side
){

  const direct=
    side==='away'
      ? g.awayLogo
      : g.homeLogo;

  if(direct)
    return direct;

  const slug=
    side==='away'
      ? g.awaySlug
      : g.homeSlug;

  if(
    g.source==='NCAA' &&
    slug
  )
    return `${NCAA_BASE}/logo/${encodeURIComponent(slug)}.svg`;

  return '';
}


function aroundDateLabel(d){

  if(
    isTodayInIndy(d)
  )
    return 'Today';

  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone:TZ,
      weekday:'short',
      month:'short',
      day:'numeric'
    }
  ).format(d);
}


function teamLogoHtml(

  abbr
){

      abbr||

    );

        <div

        ${safeAbbr}

async function fetchEspnAround(
  sport,
  league,
  label,
  dates
){

  const url=
    `${ESPN_BASE}/${sport}/${league}/scoreboard${dates?`?dates=${dates}`:''}`;

  const data=
    await fetchJson(url);

  return (
    data.events||
    []
  ).map(
    e=>
      normalizeEspnAround(
        e,
        label
      )
  );
}


async function fetchNcaaToday(
  sport,
  division,
  label
){

  try{

    const data=
      await fetchJson(
        `${NCAA_BASE}/scoreboard/${sport}/${division}`
      );

    return (
      data.games||
      []
    ).map(
      g=>
        normalizeNcaaAround(
          g,
          label
        )
    );

  }catch(e){

    return [];
  }
}


function espnDateString(
  d=new Date()
){

  const parts=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).formatToParts(d);

  const obj=
    Object.fromEntries(
      parts.map(
        x=>[
          x.type,
          x.value
        ]
      )
    );

  return `${obj.year}${obj.month}${obj.day}`;
}


async function loadAroundSports(){

  const dayName=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        weekday:'short'
      }
    ).format(
      new Date()
    );

  const dow=
    [
      'Sun',
      'Mon',
      'Tue',
      'Wed',
      'Thu',
      'Fri',
      'Sat'
    ].indexOf(
      dayName
    );

  const dates=
    espnDateString();

  const jobs=[

    fetchEspnAround(
      'baseball',
      'mlb',
      'MLB',
      dates
    ),

    fetchEspnAround(
      'football',
      'nfl',
      'NFL',
      dates
    ),

    fetchEspnAround(
      'basketball',
      'nba',
      'NBA',
      dates
    ),

    fetchEspnAround(
      'basketball',
      'wnba',
      'WNBA',
      dates
    )

  ];

  if(
    dow===6
  ){

    jobs.push(
      fetchNcaaToday(
        'football',
        'fbs',
        'NCAA Football'
      )
    );

  }else{

    jobs.push(
      fetchNcaaToday(
        'basketball-men',
        'd1',
        'NCAA Men'
      )
    );

    jobs.push(
      fetchNcaaToday(
        'basketball-women',
        'd1',
        'NCAA Women'
      )
    );
  }

  const settled=
    await Promise.allSettled(
      jobs
    );

  let games=[];

  for(
    const x of settled
  ){

    if(
      x.status===
      'fulfilled'
    )
      games.push(
        ...x.value
      );
  }

  const now=
    Date.now();

  games=
    games.filter(
      g=>{

        if(
          g.state==='live'
        )
          return true;

        const diff=
          (
            g.date.getTime()-
            now
          )/
          3600000;

        if(
          g.state==='pre'
        )
          return (
            diff>=-1 &&
            diff<=18
          );

        return (
          diff>=-8 &&
          diff<=2
        );
      }
    );

  games.sort(
    (a,b)=>{

      const liveA=
        a.state==='live'
          ? 1
          : 0;

      const liveB=
        b.state==='live'
          ? 1
          : 0;

      if(
        liveA!==liveB
      )
        return liveB-liveA;

      const imp=
        aroundImportance(b)-
        aroundImportance(a);

      if(imp)
        return imp;

      const state=
        aroundStatusRank(a)-
        aroundStatusRank(b);

      if(state)
        return state;

      return a.date-b.date;
    }
  );

  let title=
    'Around Sports';

  if(
    dow===6
  )
    title=
      'College Football Saturday';

  else if(
    dow===0
  )
    title=
      'NFL Sunday';

  renderAroundGames(
    games,
    title
  );
}


function isTodayInIndy(d){

  const f=x=>
    new Intl.DateTimeFormat(
      'en-CA',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).format(x);

  return f(d)===
    f(new Date());
}


function isPostseasonEvent(ev){

  const text=
    JSON.stringify({
      seasonType:ev?.seasonType,
      season:ev?.season,
      notes:
        competition(ev)?.notes,
      type:
        competition(ev)?.type
    });

  return (
    /postseason|playoff|bowl|championship|tournament/i
    .test(text) ||
    Number(
      ev?.seasonType
    )===3
  );
}


function favoritePriority(c){

  let pts=0;

  if(
    c.kind==='live'
  )
    pts+=10000;

  if(
    isTodayInIndy(
      eventDate(c.ev)
    )
  )
    pts+=5000;

  if(
    c.kind==='final'
  )
    pts+=3000;

  if(
    isPostseasonEvent(
      c.ev
    )
  )
    pts+=1800;

  if(
    c.t.college &&
    c.t.sport==='football' &&
    isTodayInIndy(
      eventDate(c.ev)
    )
  )
    pts+=2200;

  const hours=
    Math.abs(
      eventDate(c.ev)
      .getTime()-
      Date.now()
    )/
    3600000;

  pts+=
    Math.max(
      0,
      500-hours
    );

  return pts;
}


async function loadSports(){

  const settled=
    await Promise.allSettled(
      favoriteTeams.map(
        fetchTeamBundle
      )
    );

  const good=
    settled
      .filter(
        x=>
          x.status==='fulfilled'
      )
      .map(
        x=>
          x.value
      );

  const cards=
    good
      .map(
        buildCard
      )
      .filter(
        Boolean
      );

  cards.sort(
    (a,b)=>{

      if(
        a.isLive!==
        b.isLive
      )
        return a.isLive
          ? -1
          : 1;

      const p=
        favoritePriority(b)-
        favoritePriority(a);

      if(p)
        return p;

      return (
        eventDate(a.ev)-
        eventDate(b.ev)
      );
    }
  );

  const displayed=
    cards.slice(
      0,
      6
    );

  renderTeamCards(
    cards
  );

  renderOnDeck(
    good,
    cards,
    displayed
  );
}


loadAroundSports();
loadWeather();
loadSports();

setInterval(
  loadWeather,
  15*60*1000
);

setInterval(
  loadSports,
  60*1000
);

setInterval(
  loadAroundSports,
  60*1000
);

</script>
