<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Indy's Not For Profit Bar</title>
<style>
  :root{
    --bg:#07111c;
    --panel:#101b27;
    --panel2:#0b1520;
    --line:#33475b;
    --text:#f5f8fb;
    --muted:#94a7b8;
    --blue:#8fc7f2;
    --live:#ff5a62;
  }

  *{box-sizing:border-box}

  html,body{
    width:100%;
    height:100%;
    margin:0
  }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;
  }

  .app{
    width:100vw;
    height:100vh;
    min-height:650px;
    padding:1.7vh 1.5vw 1.2vh;
    display:grid;
    grid-template-rows:12.5vh 27vh 1fr 4.2vh;
    gap:1.5vh;
    background:radial-gradient(circle at 50% -15%,#17344d 0%,#07111c 46%,#050c13 100%);
  }

  .topbar{
    display:grid;
    grid-template-columns:25fr 45fr 30fr;
    gap:.8vw;
    min-height:0;
    width:100%;
  }

  .topbox,.brandbox,.section,.footer{
    background:linear-gradient(180deg,rgba(18,31,45,.96),rgba(9,20,31,.96));
    border:1px solid var(--line);
    border-radius:.75vw;
  }

  .topbox{
    padding:1.2vh 1.05vw;
    display:flex;
    flex-direction:column;
    justify-content:center
  }

  .brandbox{
    padding:1.2vh 1.2vw;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    text-align:right
  }

  .date{
    font-size:1.0vw;
    color:#b5c2ce;
    font-weight:750;
    letter-spacing:.03em
  }

  .time{
    font-size:2.9vw;
    font-weight:850;
    line-height:1;
    margin-top:.45vh;
    letter-spacing:-.03em
  }

  .weatherBox{
    --weather-rgb:143,199,242;
    position:relative;
    overflow:hidden;
    border-color:rgba(var(--weather-rgb),.42);
    background:
      radial-gradient(circle at 22% 40%,rgba(var(--weather-rgb),.13),transparent 42%),
      linear-gradient(180deg,rgba(18,31,45,.96),rgba(9,20,31,.96));
  }

  .weatherBox::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:.28vh;
    background:rgb(var(--weather-rgb));
    opacity:.72;
  }

  .weatherRow{
    display:flex;
    align-items:center;
    gap:1vw;
    position:relative;
    z-index:1
  }

  .weatherIcon{
    font-size:2.3vw;
    width:2.9vw;
    text-align:center;
    filter:drop-shadow(0 0 .35vw rgba(var(--weather-rgb),.35))
  }

  .temp{
    font-size:2.65vw;
    font-weight:850;
    line-height:1;
    text-shadow:0 0 .75vw rgba(var(--weather-rgb),.28)
  }

  .weatherCity{
    font-size:1.1vw;
    font-weight:800
  }

  .weatherText{
    font-size:.92vw;
    color:#c1cbd4;
    margin-top:.25vh
  }

  .hourly{
    display:flex;
    gap:1.0vw;
    margin-top:.62vh;
    color:#9fb0bf;
    font-size:.69vw;
    white-space:nowrap;
    position:relative;
    z-index:1
  }

  .sunLine{
    display:flex;
    gap:1vw;
    margin-top:.45vh;
    font-size:.64vw;
    color:#9fb0bf;
    position:relative;
    z-index:1
  }

  .sunStatus{
    font-weight:900;
    color:#e8bd72;
    letter-spacing:.06em
  }

  .brandMain{
    font-size:1.3vw;
    font-weight:850;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:#d8e8f6
  }

  .brandSub{
    font-size:.68vw;
    color:#7f95a8;
    margin-top:.45vh;
    letter-spacing:.18em;
    text-transform:uppercase
  }

  .section{
    padding:1.05vh .9vw;
    min-height:0
  }

  .favoritesSection{
    display:grid;
    grid-template-rows:auto 1fr;
    min-height:0
  }

  .sectionHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:.8vh
  }

  .sectionTitle{
    font-size:.9vw;
    text-transform:uppercase;
    letter-spacing:.18em;
    color:#b8c5d1;
    font-weight:850
  }

  .sectionNote{
    font-size:.68vw;
    color:#7f95a8
  }

  .teamGrid{
    display:grid;
    grid-template-columns:repeat(var(--team-count,5),calc((100% - 2.75vw)/6));
    justify-content:center;
    gap:.55vw;
    min-height:0;
    height:auto;
    padding-bottom:.08vh
  }

  .teamCard{
    --team-rgb:143,199,242;
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(
        180deg,
        rgba(var(--team-rgb),.26) 0%,
        rgba(var(--team-rgb),.12) 38%,
        rgba(8,18,28,.98) 100%
      );
    border:1px solid rgba(var(--team-rgb),.55);
    border-radius:.62vw;
    padding:1vh .72vw .85vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    text-align:center;
    min-width:0;
  }

  .teamCard::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(var(--team-rgb),.08),transparent 45%);
    pointer-events:none;
  }

  .teamCard::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:.32vh;
    background:rgb(var(--team-rgb));
    opacity:.9;
    pointer-events:none;
  }

  .teamCard.women{
    background:
      linear-gradient(
        180deg,
        rgba(246,243,234,.94) 0%,
        rgba(230,226,216,.90) 48%,
        rgba(20,27,34,.96) 100%
      );
    border-color:rgba(var(--team-rgb),.80);
  }

  .teamCard.women .teamName,
  .teamCard.women .match{
    color:#17212b
  }

  .teamCard.women .league{
    color:#4f5c68
  }

  .teamCard.women .badge{
    color:#25303a;
    border-color:rgba(var(--team-rgb),.5);
    background:rgba(255,255,255,.46)
  }

  .teamCard.women .bigScore{
    color:#111a22;
    text-shadow:0 1px 0 rgba(255,255,255,.35)
  }

  .teamCard.women .detail{
    color:#384653
  }

  .teamCard.women .network{
    color:rgb(var(--team-rgb))
  }

  .teamCard.women .teamLogoWrap{
    background:rgba(255,255,255,.76)
  }

  .teamCard.live{
    border:2px solid rgba(var(--team-rgb),.92);
    box-shadow:

  .teamHeader{
    position:relative;
    display:grid;
    grid-template-columns:3.0vw 1fr 3.0vw;
    align-items:start;
    gap:.35vw;
    min-height:4.0vh

  .teamLogoWrap{
    width:3vw;
    height:3vw;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(245,248,251,.92);
    border-radius:.48vw;
    padding:.22vw

    max-width:2.65vw;
    max-height:2.65vw;
    object-fit:contain;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))

    width:2.65vw;
    height:2.65vw;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:.72vw;
    font-weight:900;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:#fff

  .teamName{

    line-height:1.05;

    color:#8fa2b4;
    margin-top:.3vh;
    text-transform:uppercase;
    letter-spacing:.1em

  .sportMark{

    border-radius:.25vw;
    border:1px solid currentColor;
    font-size:.54vw;
    font-weight:950;
    letter-spacing:.08em;
    vertical-align:.05em

  .badge{

    border-radius:999px;
    border:1px solid #405266;
    color:#9cadbc;
    white-space:nowrap;
    font-weight:800;
    letter-spacing:.04em

    display:inline-block;

    height:.38vw;
    min-width:5px;
    min-height:5px;

    background:var(--live);

    vertical-align:.03em;
    box-shadow:0 0 .35vw rgba(255,90,98,.55)

    position:relative;
    font-size:.9vw;
    font-weight:800;
    color:#d7e0e8;
    margin-top:.35vh;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis

  .bigScore{
    position:relative;
    font-size:1.85vw;
    font-weight:900;
    line-height:1.03;
    letter-spacing:-.03em;
    margin:.3vh 0

  .meta{
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:.45vw;
    text-align:left
  }

  .detail{
    font-size:.72vw;
    color:#9dafbf;
    line-height:1.25

  .network{
    font-size:.78vw;
    font-weight:950;
    color:var(--blue);
    letter-spacing:.05em;
    margin-top:.35vh;
    text-align:right;
    white-space:nowrap

    justify-content:center;
    color:#8195a7;
    font-size:1vw;
    border:1px dashed #33475b;
    border-radius:.62vw

  .main{
    min-height:0;
    display:grid;
    grid-template-columns:1.7fr .9fr;
    gap:.8vw
  }

  .aroundSection,
  .comingSection{
    overflow:hidden

  .gameList{
    display:grid;
    grid-template-columns:1fr;
    gap:.65vh

  .gameCard{
    background:#0b1621;
    border:1px solid #2f4254;

    padding:.8vh .65vw;
    min-height:7.5vh;
    display:grid;
    grid-template-columns:2.45vw 1fr auto;

    align-items:center

    text-align:center;
    line-height:1

    font-weight:950;
    font-size:.8vw

  .comingTeams{
    font-size:.88vw;
    font-weight:850;
    line-height:1.15

  .comingNetwork{
    font-size:.78vw;
    font-weight:950;
    color:var(--blue);
    white-space:nowrap
  }

  .tiny{
    font-size:.68vw;
    color:#9aabba;

    height:100%;

    justify-content:center;
    text-align:center;
    color:#7890a3;
    font-size:.86vw;
    line-height:1.5;
    padding:2vw
  }

  .footer{
    padding:.6vh .8vw;
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    gap:1vw
  }

  .footerLeft{
    font-size:.65vw;
    color:#73899b;
    letter-spacing:.05em
  }

  .footerRight{
    font-size:.72vw;
    font-weight:850;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#a9b9c6
  }

  const r=
    await fetch(
      url,
      {cache:'no-store'}
    );

  if(!r.ok){
    throw new Error(
      `${r.status} ${url}`
    );
  }

  return r.json();
}

}


function fmtTime(d){

  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone:TZ,
      hour:'numeric',
      minute:'2-digit'
    }
  ).format(d);
}


function fmtShortDateTime(d){

  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone:TZ,
      weekday:'short',
      month:'short',
      day:'numeric',
      hour:'numeric',
      minute:'2-digit'
    }
  ).format(d);
}


function weatherDescriptor(code){

  if(code===0) return ['☀️','Clear'];
  if(code<=2) return ['🌤️','Mostly clear'];
  if(code===3) return ['☁️','Cloudy'];
  if(code===45||code===48) return ['🌫️','Fog'];
  if(code>=51&&code<=57) return ['🌦️','Drizzle'];
  if(code>=61&&code<=67) return ['🌧️','Rain'];
  if(code>=71&&code<=77) return ['❄️','Snow'];
  if(code>=80&&code<=82) return ['🌦️','Showers'];
  if(code>=85&&code<=86) return ['🌨️','Snow showers'];
  if(code>=95) return ['⛈️','Thunderstorms'];

  return ['◌','Weather'];
}


function weatherAccent(code){

  if(code===0||code===1)
    return '232,190,88';

  if(
    code===2||
    code===3||
    code===45||
    code===48
  )
    return '151,181,205';

  if(
    (code>=51&&code<=67)||
    (code>=80&&code<=82)
  )
    return '74,153,211';

  if(
    (code>=71&&code<=77)||
    (code>=85&&code<=86)
  )
    return '176,220,239';

  if(code>=95)
    return '150,123,213';

  return '143,199,242';
}


function parseLocalMinutes(iso){

  const m=
    String(iso||'')
    .match(/T(\d\d):(\d\d)/);

  if(!m)
    return null;

  return Number(m[1])*60+
    Number(m[2]);
}


function indyMinutesNow(){

  const parts=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        hour:'2-digit',
        minute:'2-digit',
        hour12:false
      }
    ).formatToParts(
      new Date()
    );

  const o=
    Object.fromEntries(
      parts.map(
        x=>[
          x.type,
          x.value
        ]
      )
    );

  return Number(o.hour)*60+
    Number(o.minute);
}


async function loadWeather(){

  try{

    const url=
      'https://api.open-meteo.com/v1/forecast?latitude=39.7684&longitude=-86.1581'+
      '&current=temperature_2m,apparent_temperature,weather_code'+
      '&hourly=temperature_2m,precipitation_probability'+
      '&daily=sunrise,sunset'+
      '&temperature_unit=fahrenheit'+
      '&timezone=America%2FIndiana%2FIndianapolis'+
      '&forecast_days=2';

    const w=
      await fetchJson(url);

    const c=
      w.current;

    const [icon,desc]=
      weatherDescriptor(
        c.weather_code
      );

    document
      .getElementById('weatherIcon')
      .textContent=
        icon;

    document
      .getElementById('temp')
      .textContent=
        `${Math.round(c.temperature_2m)}°`;

    document
      .getElementById('weatherText')
      .textContent=
        `${desc} · Feels ${Math.round(c.apparent_temperature)}°`;

    document
      .getElementById('weatherBox')
      .style
      .setProperty(
        '--weather-rgb',
        weatherAccent(c.weather_code)
      );

    const next=[];
    const now=Date.now();

    for(
      let i=0;
      i<w.hourly.time.length;
      i++
    ){

      const d=
        new Date(
          w.hourly.time[i]
        );

      if(d.getTime()>now){

        next.push({
          date:d,
          temp:
            Math.round(
              w.hourly.temperature_2m[i]
            ),
          precip:
            Math.round(
              w.hourly.precipitation_probability[i]||
              0
            )
        });
      }

      if(next.length===3)
        break;
    }

    document
      .getElementById('hourly')
      .innerHTML=
        next.map(
          x=>
            `<span>${fmtTime(x.date)} · ${x.temp}° · ${x.precip}% rain</span>`
        ).join('');

    const rise=
      w.daily?.sunrise?.[0]||
      '';

    const set=
      w.daily?.sunset?.[0]||
      '';

    document
      .getElementById('sunrise')
      .textContent=
        rise
          ? `Sunrise ${fmtTime(new Date(rise))}`
          : 'Sunrise —';

    document
      .getElementById('sunset')
      .textContent=
        set
          ? `Sunset ${fmtTime(new Date(set))}`
          : 'Sunset —';

    const riseMin=
      parseLocalMinutes(rise);

    const setMin=
      parseLocalMinutes(set);

    const nowMin=
      indyMinutesNow();

    const sunUp=
      riseMin!==null &&
      setMin!==null &&
      nowMin>=riseMin &&
      nowMin<setMin;

    document
      .getElementById('sunStatus')
      .textContent=
        sunUp
          ? '☀ SUN UP'
          : '☾ SUN DOWN';

  }catch(e){

    document
      .getElementById('weatherText')
      .textContent=
        'Weather unavailable';
  }
}


function eventDate(ev){

  return new Date(
    ev?.date||
    ev?.competitions?.[0]?.date||
    0
  );
}


function statusType(ev){

  return (
    ev?.competitions?.[0]?.status?.type||
    ev?.status?.type||
    {}
  );
}


function eventState(ev){

  return statusType(ev).state||
    '';
}


function isCompleted(ev){

  const s=
    statusType(ev);

  return !!s.completed||
    s.state==='post';
}


function isSaneLive(ev){

  if(eventState(ev)!=='in')
    return false;

  const t=
    eventDate(ev).getTime();

  if(!t)
    return false;

  return Math.abs(
    Date.now()-t
  )<=
    LIVE_SANITY_HOURS*
    3600000;
}


function isTodayInIndy(d){

  const f=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    );

  return f.format(d)===
    f.format(new Date());
}


function indyMonth(){

  return Number(
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        month:'numeric'
      }
    ).format(
      new Date()
    )
  );
}


function footballSeasonActive(team){

  if(team?.sport!=='football')
    return false;

  const month=
    indyMonth();

  if(team.league==='nfl')
    return month>=8||
      month<=2;

  return month>=8||
    month<=1;
}


function isUpcomingWithin(ev,days){

  if(
    isCompleted(ev)||
    eventState(ev)==='in'
  )
    return false;

  const when=
    eventDate(ev).getTime();

  if(!when)
    return false;

  return (
    when>=Date.now()-3600000 &&
    when<=Date.now()+days*86400000
  );
}


function isEligibleUpcoming(ev,team){

  if(
    isCompleted(ev)||
    eventState(ev)==='in'
  )
    return false;

  const when=
    eventDate(ev).getTime();

  if(
    !when||
    when<Date.now()-3600000
  )
    return false;

  if(
    footballSeasonActive(team)
  )
    return true;

  return isUpcomingWithin(
    ev,
    ACTIVE_WINDOW_DAYS
  );
}


function isRecentFinal(ev,hours){

  if(!isCompleted(ev))
    return false;

  const t=
    eventDate(ev).getTime();

  if(!t)
    return false;

  return (
    Date.now()-t <=
    hours*3600000
  );
}


function competitors(ev){

  return ev?.competitions?.[0]?.competitors||
    [];
}


function findCompetitor(ev,teamId){

  return competitors(ev)
    .find(
      x=>
        String(x.team?.id)===
        String(teamId)
    );
}


function otherCompetitor(ev,teamId){

  return competitors(ev)
    .find(
      x=>
        String(x.team?.id)!==
        String(teamId)
    );
}


function scoreValue(comp){

  const s=
    comp?.score;

  if(
    s &&
    typeof s==='object' &&
    'value' in s
  )
    return s.value;

  return s??'';
}


function opponentText(ev,teamId){

  const me=
    findCompetitor(
      ev,
      teamId
    );

  const opp=
    otherCompetitor(
      ev,
      teamId
    );

  const name=
    opp?.team?.shortDisplayName||
    opp?.team?.displayName||
    opp?.team?.name||
    'TBD';

  if(!me)
    return `vs ${name}`;

  return me.homeAway==='away'
    ? `at ${name}`
    : `vs ${name}`;
}


function statusText(ev){

  const s=
    ev?.competitions?.[0]?.status||
    ev?.status||
    {};

  return (
    s.type?.shortDetail||
    s.type?.detail||
    s.displayClock||
    ''
  );
}


function networkOf(ev){

  if(ev?._resolvedNetwork)
    return ev._resolvedNetwork;

  const c=
    ev?.competitions?.[0]||
    {};

  const names=[];

  for(
    const b of c.broadcasts||
    []
  ){
    for(
      const n of b.names||
      []
    ){
      if(n)
        names.push(n);
    }
  }

  for(
    const b of ev?.broadcasts||
    []
  ){
    for(
      const n of b.names||
      []
    ){
      if(n)
        names.push(n);
    }
  }

  return [...new Set(names)]
    .join(' / ')||
    'TV TBD';
}


async function fallbackNetworkForEvent(
  team,
  event
){

  if(
    !event?.id ||
    networkOf(event)!=='TV TBD'
  )
    return networkOf(event);

  const key=
    `${team.sport}/${team.league}/${event.id}`;

  const cached=
    broadcastCache.get(key);

  if(
    cached &&
    Date.now()-cached.at <
    BROADCAST_CACHE_MS
  )
    return cached.network;

  try{

    const data=
      await fetchJson(
        `${ESPN_BASE}/${team.sport}/${team.league}/summary?event=${event.id}`
      );

    const names=[];

    for(
      const b of
      data?.header?.competitions?.[0]?.broadcasts||
      []
    ){
      for(
        const n of b.names||
        []
      ){
        if(n)
          names.push(n);
      }
    }

    const network=
      [...new Set(names)]
      .join(' / ')||
      'TV TBD';

    broadcastCache.set(
      key,
      {
        at:Date.now(),
        network
      }
    );

    return network;

  }catch(e){

    broadcastCache.set(
      key,
      {
        at:Date.now(),
        network:'TV TBD'
      }
    );

    return 'TV TBD';
  }
}


async function fetchTeamBundle(team){

  const base=
    `${ESPN_BASE}/${team.sport}/${team.league}`;

  const [
    scheduleRes,
    teamRes
  ]=
    await Promise.allSettled([

      fetchJson(
        `${base}/teams/${team.teamId}/schedule`
      ),

      fetchJson(
        `${base}/teams/${team.teamId}`
      )

    ]);

  if(
    scheduleRes.status!==
    'fulfilled'
  )
    throw scheduleRes.reason;

  const schedule=
    scheduleRes.value;

  const teamJson=
    teamRes.status==='fulfilled'
      ? teamRes.value
      : {};

  const events=
    schedule.events||
    [];

  const logo=
    teamJson?.team?.logos?.[0]?.href||
    teamJson?.team?.logo||
    team.fallbackLogo;

  const record=
    teamJson?.team?.record?.items?.[0]?.summary||
    teamJson?.team?.recordSummary||
    '';

  const relevant=
    events
      .filter(
        e=>
          isSaneLive(e)||
          isRecentFinal(
            e,
            team.recentFinalHours
          )||
          isEligibleUpcoming(
            e,
            team
          )
      )
      .sort(
        (a,b)=>
          eventDate(a)-
          eventDate(b)
      )
      .slice(0,8);

  await Promise.all(
    relevant.map(
      async e=>{

        if(
          networkOf(e)===
          'TV TBD'
        ){

          const n=
            await fallbackNetworkForEvent(
              team,
              e
            );

          if(
            n &&
            n!=='TV TBD'
          )
            e._resolvedNetwork=n;
        }
      }
    )
  );

  return {
    team,
    events,
    logo,
    record
  };
}


function chooseDisplayEvent(
  events,
  team
){

  const valid=
    (events||[])
    .filter(
      e=>
        eventDate(e)
        .getTime()>0
    );

  const live=
    valid
      .filter(
        isSaneLive
      )
      .sort(
        (a,b)=>
          eventDate(a)-
          eventDate(b)
      )[0];

  if(live)
    return {
      event:live,
      kind:'live'
    };

  const recentFinal=
    valid
      .filter(
        e=>
          isRecentFinal(
            e,
            team.recentFinalHours
          )
      )
      .sort(
        (a,b)=>
          eventDate(b)-
          eventDate(a)
      )[0];

  if(recentFinal)
    return {
      event:recentFinal,
      kind:'final'
    };

  const next=
    valid
      .filter(
        e=>
          isEligibleUpcoming(
            e,
            team
          )
      )
      .sort(
        (a,b)=>
          eventDate(a)-
          eventDate(b)
      )[0];

  if(next)
    return {
      event:next,
      kind:'upcoming'
    };

  return null;
}


function buildCard(bundle){

  const chosen=
    chooseDisplayEvent(
      bundle.events,
      bundle.team
    );

  if(!chosen)
    return null;

  const t=
    bundle.team;

  const ev=
    chosen.event;

  const me=
    findCompetitor(
      ev,
      t.teamId
    );

  const opp=
    otherCompetitor(
      ev,
      t.teamId
    );

  const oppName=
    opp?.team?.shortDisplayName||
    opp?.team?.displayName||
    opp?.team?.name||
    'TBD';

  const isLive=
    chosen.kind==='live';

  let badge='';
  let match='';
  let headline='';
  let detail='';

  match=
    me?.homeAway==='away'
      ? `at ${oppName}`
      : `vs ${oppName}`;

  if(chosen.kind==='live'){

    badge=
      '<span class="liveDot"></span>LIVE';

    headline=
      `${scoreValue(me)} – ${scoreValue(opp)}`;

    detail=
      statusText(ev)||
      'Live';

  }else if(
    chosen.kind==='final'
  ){

    badge='FINAL';

    headline=
      `${scoreValue(me)} – ${scoreValue(opp)}`;

    detail=
      new Intl.DateTimeFormat(
        'en-US',
        {
          timeZone:TZ,
          weekday:'short',
          month:'short',
          day:'numeric'
        }
      ).format(
        eventDate(ev)
      );

  }else{

    badge=
      isTodayInIndy(
        eventDate(ev)
      )
        ? 'TODAY'
        : 'NEXT';

    headline=
      fmtTime(
        eventDate(ev)
      );

    detail=
      new Intl.DateTimeFormat(
        'en-US',
        {
          timeZone:TZ,
          weekday:'short',
          month:'short',
          day:'numeric'
        }
      ).format(
        eventDate(ev)
      );
  }

  return {
    t,
    ev,
    kind:chosen.kind,
    isLive,
    logo:bundle.logo,
    record:bundle.record,
    badge,
    match,
    headline,
    detail,
    network:
      networkOf(ev)
  };
}

function renderOnDeck(
  bundles,
  allCards,
  displayedCards
){

  const list=
    document
      .getElementById(
        'comingList'
      );

  list.innerHTML='';

  const displayedEvents=
    new Set(
      displayedCards.map(
        c=>
          String(
            c.ev?.id||
            ''
          )
      )
    );

  const items=[];
  const seen=new Set();


  /*
    Overflow favorites get first claim
    on the panel.
  */

  for(
    const c of allCards.slice(6)
  ){

    const id=
      `${c.t.key}:${c.ev?.id||eventDate(c.ev).getTime()}`;

    if(seen.has(id))
      continue;

    seen.add(id);

    items.push({
      type:'overflow',
      t:c.t,
      e:c.ev,
      kind:c.kind,
      isLive:c.isLive,
      logo:c.logo
    });
  }


  /*
    Then look ahead seven days for
    ADDITIONAL favorite-team games.

    A team can appear in both areas.
    The exact same event cannot.
  */

  const now=
    Date.now();

  const week=
    now+
    7*86400000;

  const upcoming=[];

  for(
    const b of bundles
  ){

    for(
      const e of b.events
    ){

      const when=
        eventDate(e)
        .getTime();

      if(
        isCompleted(e)||
        isSaneLive(e)||
        when<now-3600000||
        when>week
      )
        continue;

      if(
        displayedEvents.has(
          String(
            e.id||
            ''
          )
        )
      )
        continue;

      const id=
        `${b.team.key}:${e.id||when}`;

      if(seen.has(id))
        continue;

      seen.add(id);

      upcoming.push({
        type:'upcoming',
        t:b.team,
        e,
        kind:'upcoming',
        isLive:false,
        logo:b.logo
      });
    }
  }

  upcoming.sort(
    (a,b)=>
      eventDate(a.e)-
      eventDate(b.e)
  );

  items.push(
    ...upcoming
  );

  if(!items.length){

    list.innerHTML=
      '<div class="phaseMsg">Nothing else scheduled for your teams in the next seven days.</div>';

    return;
  }


  for(
    const x of items.slice(0,7)
  ){

    const d=
      eventDate(x.e);

    const div=
      document.createElement(
        'div'
      );

    div.className=
      'comingItem';

    let left='';

    if(x.kind==='live'){

      left='LIVE';

    }else if(
      x.kind==='final'
    ){

      left='FINAL';

    }else{

      left=
        new Intl.DateTimeFormat(
          'en-US',
          {
            timeZone:TZ,
            weekday:'short'
          }
        )
        .format(d)
        .toUpperCase();
    }

    const sub=
      x.kind==='live'
        ? statusText(x.e)
        : (
            x.kind==='final'
              ? `${statusText(x.e)} · ${fmtShortDateTime(d)}`
              : fmtShortDateTime(d)
          );

    div.innerHTML=`

      <div class="comingLogoWrap">

        <img
          class="comingLogo"
          src="${x.logo||x.t.fallbackLogo}"
          alt="${x.t.name}"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='block';
          "
        >

        <div class="comingLogoFallback">
          ${x.t.short}
        </div>

      </div>


      <div class="comingTime">
        ${left}
      </div>


      <div>

        <div class="comingTeams">
          ${x.t.name}
          ${opponentText(x.e,x.t.teamId)}
        </div>

        <div class="tiny">
          ${sub}
        </div>

      </div>


      <div class="comingNetwork">
        ${networkOf(x.e)}
      </div>
    `;

    list.appendChild(div);
  }
}


function eventType(ev){

  return (
    ev?.season?.type?.name||
    ev?.seasonType?.name||
    ev?.competitions?.[0]?.type?.text||
    ''
  );
}


function isPostseasonEvent(ev){

  return /post|playoff|tournament|championship|bowl/i
    .test(
      `${eventType(ev)} ${ev?.name||''} ${ev?.shortName||''}`
    );
}


function favoritePriority(c){

  let pts=0;

  if(c.kind==='live')
    pts+=10000;

  if(
    isTodayInIndy(
      eventDate(c.ev)
    )
  )
    pts+=5000;

  if(c.kind==='final')
    pts+=3000;

  if(
    isPostseasonEvent(
      c.ev
    )
  )
    pts+=1800;

  if(
    c.t.college &&
    c.t.sport==='football' &&
    isTodayInIndy(
      eventDate(c.ev)
    )
  )
    pts+=2200;

  const hours=
    Math.abs(
      eventDate(c.ev)
      .getTime()-
      Date.now()
    )/
    3600000;

  pts+=
    Math.max(
      0,
      500-hours
    );

  return pts;
}


function aroundStatusRank(g){

  if(g.state==='live')
    return 0;

  if(g.state==='pre')
    return 1;

  return 2;
}


function normalizeEspnAround(
  event,
  leagueLabel
){

  const c=
    event?.competitions?.[0]||
    {};

  const comps=
    c.competitors||
    [];

  const home=
    comps.find(
      x=>x.homeAway==='home'
    )||
    comps[0]||
    {};

  const away=
    comps.find(
      x=>x.homeAway==='away'
    )||
    comps[1]||
    {};

  const st=
    c.status?.type||
    event?.status?.type||
    {};

  const state=
    st.state==='in'
      ? 'live'
      : (
          st.completed||
          st.state==='post'
            ? 'post'
            : 'pre'
        );

  const rank=x=>{

    const r=
      Number(
        x?.curatedRank?.current||
        x?.team?.rank||
        0
      )||
      0;

    return (
      /^NCAA/.test(
        leagueLabel
      ) &&
      r>=1 &&
      r<=25
    )
      ? r
      : 0;
  };

  const score=x=>
    Number(
      scoreValue(x)||
      0
    );

  return {

    source:'ESPN',

    league:
      leagueLabel,

    state,

    date:
      new Date(
        event.date||
        c.date||
        0
      ),

    away:
      away.team?.shortDisplayName||
      away.team?.displayName||
      away.team?.name||
      'Away',

    home:
      home.team?.shortDisplayName||
      home.team?.displayName||
      home.team?.name||
      'Home',

    awayScore:
      score(away),

    homeScore:
      score(home),

    awayRank:
      rank(away),

    homeRank:
      rank(home),

    status:
      st.shortDetail||
      st.detail||
      '',

    network:
      networkOf(event)
  };
}


function normalizeNcaaAround(
  wrapper,
  leagueLabel
){

  const g=
    wrapper?.game||
    wrapper||
    {};

  const toRank=v=>
    Number(v)||
    0;

  const toScore=v=>
    Number(v)||
    0;

  let dt=null;

  if(g.startTimeEpoch){

    dt=
      new Date(
        Number(g.startTimeEpoch)*
        1000
      );
  }

  if(
    !dt||
    !dt.getTime()
  ){

    const raw=
      `${g.startDate||''} ${g.startTime||''}`
      .replace(
        / ET$/,
        ''
      );

    const trial=
      new Date(raw);

    if(trial.getTime())
      dt=trial;
  }

  return {

    source:'NCAA',

    league:
      leagueLabel,

    state:
      g.gameState==='live'
        ? 'live'
        : (
            g.gameState==='final'
              ? 'post'
              : 'pre'
          ),

    date:
      dt||
      new Date(0),

    away:
      g.away?.names?.short||
      g.away?.names?.full||
      'Away',

    home:
      g.home?.names?.short||
      g.home?.names?.full||
      'Home',

    awayScore:
      toScore(
        g.away?.score
      ),

    homeScore:
      toScore(
        g.home?.score
      ),

    awayRank:
      toRank(
        g.away?.rank
      ),

    homeRank:
      toRank(
        g.home?.rank
      ),

    status:
      g.gameState==='live'
        ? `${g.currentPeriod||''}${g.contestClock ? ` · ${g.contestClock}`:''}`.trim()
        : (
            g.finalMessage||
            g.startTime||
            ''
          ),

    network:
      g.network||
      'TV TBD'
  };
}


function aroundImportance(g){

  let pts=0;

  const now=
    Date.now();

  const hours=
    Math.abs(
      g.date.getTime()-
      now
    )/
    3600000;

  if(g.state==='live'){

    pts+=100;

  }else if(
    g.state==='pre'
  ){

    pts+=
      Math.max(
        0,
        45-hours*2
      );

  }else{

    pts+=8;
  }

  const ranked=
    (
      g.awayRank>0
        ? 1
        : 0
    )+
    (
      g.homeRank>0
        ? 1
        : 0
    );

  pts+=ranked*18;

  if(
    g.awayRank>0 &&
    g.awayRank<=10
  )
    pts+=9;

  if(
    g.homeRank>0 &&
    g.homeRank<=10
  )
    pts+=9;

  if(g.state==='live'){

    const margin=
      Math.abs(
        g.awayScore-
        g.homeScore
      );

    if(margin<=3)
      pts+=25;

    else if(margin<=7)
      pts+=16;

    else if(margin<=14)
      pts+=7;

    if(
      (
        g.awayRank &&
        g.homeScore>
        g.awayScore
      )||
      (
        g.homeRank &&
        g.awayScore>
        g.homeScore
      )
    )
      pts+=14;
  }

  if(
    /playoff|championship|wild card|tournament/i
    .test(
      g.status||
      ''
    )
  )
    pts+=20;

  return pts;
}


function rankLabel(
  rank,
  name
){

  return rank
    ? `#${rank} ${name}`
    : name;
}


/*
  Around Sports league marks.

  Pro sports use ESPN's league marks.

  For NCAA sport-specific marks, these
  filenames are ready to be used from
  the GitHub repository root:

    ncaa-football.png
    ncaa-mens-basketball.png
    ncaa-womens-basketball.png

  Until those official NCAA assets are
  uploaded, they fall back to the NCAA
  disc so nothing breaks.
*/

function leagueLogoInfo(league){

  const key=
    String(
      league||
      ''
    ).toUpperCase();

  if(key==='MLB')
    return {
      src:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png',
      fallback:'',
      label:'MLB'
    };

  if(key==='NFL')
    return {
      src:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png',
      fallback:'',
      label:'NFL'
    };

  if(key==='NBA')
    return {
      src:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png',
      fallback:'',
      label:'NBA'
    };

  if(key==='WNBA')
    return {
      src:'https://a.espncdn.com/i/teamlogos/leagues/500/wnba.png',
      fallback:'',
      label:'WNBA'
    };

  const generic=
    'https://a.espncdn.com/i/teamlogos/leagues/500/ncaa.png';

  if(
    key.includes(
      'FOOTBALL'
    )
  )
    return {
      src:'ncaa-football.png',
      fallback:generic,
      label:'NCAA Football'
    };

  if(
    key.includes(
      'WOMEN'
    )
  )
    return {
      src:'ncaa-womens-basketball.png',
      fallback:generic,
      label:'NCAA Women'
    };

  if(
    key.includes(
      'MEN'
    )
  )
    return {
      src:'ncaa-mens-basketball.png',
      fallback:generic,
      label:'NCAA Men'
    };

  return {
    src:generic,
    fallback:'',
    label:'NCAA'
  };
}


function renderAroundGames(
  games,
  title
){

  document
    .getElementById(
      'aroundTitle'
    )
    .textContent=
      title;

  const list=
    document
      .getElementById(
        'gameList'
      );

  list.innerHTML='';

  if(!games.length){

    list.innerHTML=
      '<div class="phaseMsg">Nothing compelling on the board right now.</div>';

    return;
  }

  for(
    const g of games.slice(0,6)
  ){

    const d=
      document.createElement(
        'div'
      );

    d.className=
      `gameCard${g.state==='live'?' live':''}`;

    const teams=
      `${rankLabel(g.awayRank,g.away)} at ${rankLabel(g.homeRank,g.home)}`;

    let main='';

    if(
      g.state==='live'||
      g.state==='post'
    ){

      main=
        `${g.awayScore} – ${g.homeScore}`;

    }else{

      main=
        fmtTime(
          g.date
        );
    }

    const context=
      g.state==='live'
        ? `<span class="aroundLive"><span class="liveDot"></span>LIVE</span> · ${g.status||g.league}`
        : (
            g.state==='post'
              ? `FINAL · ${g.league}`
              : `${g.league} · ${fmtShortDateTime(g.date)}`
          );

    const leagueLogo=
      leagueLogoInfo(
        g.league
      );

    const fallbackAttr=
      leagueLogo.fallback
        ? `data-fallback="${leagueLogo.fallback}"`
        : '';

    d.innerHTML=`

      <div class="leagueLogoWrap">

        <img
          class="leagueLogo"
          src="${leagueLogo.src}"
          ${fallbackAttr}
          alt="${leagueLogo.label}"
          onerror="
            if(
              this.dataset.fallback &&
              this.src!==this.dataset.fallback
            ){
              this.src=this.dataset.fallback;
              this.dataset.fallback='';
            }else{
              this.style.display='none';
              this.nextElementSibling.style.display='block';
            }
          "
        >

        <div class="leagueLogoFallback">
          ${leagueLogo.label}
        </div>

      </div>


      <div>

        <div class="gameTeams">
          ${teams}
        </div>

        <div class="gameContext">
          ${context}
        </div>

      </div>


      <div class="gameRight">

        <div class="gameScore">
          ${main}
        </div>

        <div class="gameNetwork">
          ${g.network||'TV TBD'}
        </div>

      </div>
    `;

    list.appendChild(d);
  }
}


async function fetchEspnAround(
  sport,
  league,
  label,
  dates
){

  const url=
    `${ESPN_BASE}/${sport}/${league}/scoreboard${dates?`?dates=${dates}`:''}`;

  const data=
    await fetchJson(url);

  return (
    data.events||
    []
  ).map(
    e=>
      normalizeEspnAround(
        e,
        label
      )
  );
}


async function fetchNcaaToday(
  sport,
  division,
  label
){

  try{

    const data=
      await fetchJson(
        `${NCAA_BASE}/scoreboard/${sport}/${division}`
      );

    return (
      data.games||
      []
    ).map(
      g=>
        normalizeNcaaAround(
          g,
          label
        )
    );

  }catch(e){

    return [];
  }
}


function espnDateString(
  d=new Date()
){

  const parts=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    ).formatToParts(d);

  const obj=
    Object.fromEntries(
      parts.map(
        x=>[
          x.type,
          x.value
        ]
      )
    );

  return (
    obj.year+
    obj.month+
    obj.day
  );
}


async function loadAroundSports(){

  const dayName=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        weekday:'short'
      }
    ).format(
      new Date()
    );

  const dow=
    [
      'Sun',
      'Mon',
      'Tue',
      'Wed',
      'Thu',
      'Fri',
      'Sat'
    ].indexOf(
      dayName
    );

  const dates=
    espnDateString();

  const jobs=[

    fetchEspnAround(
      'baseball',
      'mlb',
      'MLB',
      dates
    ),

    fetchEspnAround(
      'football',
      'nfl',
      'NFL',
      dates
    ),

    fetchEspnAround(
      'basketball',
      'nba',
      'NBA',
      dates
    ),

    fetchEspnAround(
      'basketball',
      'wnba',
      'WNBA',
      dates
    )

  ];

  if(dow===6){

    jobs.push(
      fetchNcaaToday(
        'football',
        'fbs',
        'NCAA Football'
      )
    );

  }else{

    jobs.push(
      fetchNcaaToday(
        'basketball-men',
        'd1',
        'NCAA Men'
      )
    );

    jobs.push(
      fetchNcaaToday(
        'basketball-women',
        'd1',
        'NCAA Women'
      )
    );
  }

  const settled=
    await Promise.allSettled(
      jobs
    );

  let games=[];

  for(
    const x of settled
  ){

    if(
      x.status==='fulfilled'
    )
      games.push(
        ...x.value
      );
  }

  const now=
    Date.now();

  games=
    games.filter(
      g=>{

        if(
          g.state==='live'
        )
          return true;

        const diff=
          (
            g.date.getTime()-
            now
          )/
          3600000;

        if(
          g.state==='pre'
        )
          return (
            diff>=-1 &&
            diff<=18
          );

        return (
          diff>=-8 &&
          diff<=2
        );
      }
    );

  games.sort(
    (a,b)=>{

      const liveA=
        a.state==='live'
          ? 1
          : 0;

      const liveB=
        b.state==='live'
          ? 1
          : 0;

      if(liveA!==liveB)
        return liveB-liveA;

      const imp=
        aroundImportance(b)-
        aroundImportance(a);

      if(imp)
        return imp;

      const state=
        aroundStatusRank(a)-
        aroundStatusRank(b);

      if(state)
        return state;

      return a.date-b.date;
    }
  );

  let title=
    'Around Sports';

  if(dow===6)
    title=
      'College Football Saturday';

  else if(dow===0)
    title=
      'NFL Sunday';

  renderAroundGames(
    games,
    title
  );
}


async function loadSports(){

  const settled=
    await Promise.allSettled(
      favoriteTeams.map(
        fetchTeamBundle
      )
    );

  const good=
    settled
      .filter(
        x=>
          x.status==='fulfilled'
      )
      .map(
        x=>
          x.value
      );

  const cards=
    good
      .map(
        buildCard
      )
      .filter(
        Boolean
      );

  cards.sort(
    (a,b)=>{

      /*
        LIVE is absolute.
      */

      if(
        a.isLive!==
        b.isLive
      )
        return a.isLive
          ? -1
          : 1;

      const p=
        favoritePriority(b)-
        favoritePriority(a);

      if(p)
        return p;

      return (
        eventDate(a.ev)-
        eventDate(b.ev)
      );
    }
  );

  const displayed=
    cards.slice(0,6);

  renderTeamCards(
    cards
  );

  renderOnDeck(
    good,
    cards,
    displayed
  );
}


updateClock();
loadWeather();
loadSports();
loadAroundSports();

setInterval(
  updateClock,
  1000
);

setInterval(
  loadWeather,
  15*60*1000
);

setInterval(
  loadSports,
  60*1000
);

setInterval(
  loadAroundSports,
  60*1000
);

</script>
