function fetchJson(url){
  return fetch(
    url,
    {
      cache:'no-store'
    }
  ).then(r=>{
    if(!r.ok){
      throw new Error(
        `${r.status} ${url}`
      );
    }

    return r.json();
  });
}


function scoreValue(comp){
  const s=comp?.score;

  if(
    s &&
    typeof s==='object' &&
    'value' in s
  ){
    return s.value;
  }

  return s ?? '';
}


function eventDate(ev){
  return new Date(
    ev?.date ||
    ev?.competitions?.[0]?.date ||
    0
  );
}


function eventType(ev){
  return (
    ev?.season?.type?.name ||
    ev?.seasonType?.name ||
    ev?.competitions?.[0]?.type?.text ||
    ''
  );
}


function isPostseasonEvent(ev){
  return /post|playoff|tournament|championship|bowl/i
    .test(
      `${eventType(ev)} ${ev?.name||''} ${ev?.shortName||''}`
    );
}


function eventState(ev){
  const t=
    ev?.competitions?.[0]?.status?.type ||
    ev?.status?.type ||
    {};

  return t.state ||
    (
      t.completed
        ? 'post'
        : ''
    );
}


function isCompleted(ev){
  const t=
    ev?.competitions?.[0]?.status?.type ||
    ev?.status?.type ||
    {};

  return !!t.completed ||
    t.state==='post';
}


function isSaneLive(ev){
  if(eventState(ev)!=='in'){
    return false;
  }

  const start=
    eventDate(ev).getTime();

  if(!start){
    return false;
  }

  return Math.abs(
    Date.now()-start
  ) <=
  LIVE_SANITY_HOURS*3600000;
}


function isTodayInIndy(d){
  const fmt=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    );

  return fmt.format(d)===
    fmt.format(new Date());
}


function isUpcomingWithin(ev,days){
  if(
    isCompleted(ev) ||
    eventState(ev)==='in'
  ){
    return false;
  }

  const when=
    eventDate(ev).getTime();

  if(!when){
    return false;
  }

  const diff=
    when-Date.now();

  return diff>=-3600000 &&
    diff<=days*86400000;
}


function indyMonth(){
  return Number(
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        month:'numeric'
      }
    ).format(
      new Date()
    )
  );
}


function footballSeasonActive(team){
  if(team?.sport!=='football'){
    return false;
  }

  const month=
    indyMonth();

  if(team.league==='nfl'){
    return month>=8 ||
      month<=2;
  }

  return month>=8 ||
    month<=1;
}


function isEligibleUpcoming(ev,team){
  if(
    isCompleted(ev) ||
    eventState(ev)==='in'
  ){
    return false;
  }

  const when=
    eventDate(ev).getTime();

  if(
    !when ||
    when<Date.now()-3600000
  ){
    return false;
  }

  if(
    footballSeasonActive(team)
  ){
    return true;
  }

  return isUpcomingWithin(
    ev,
    ACTIVE_WINDOW_DAYS
  );
}


function finalStillRelevant(ev,team){
  if(!isCompleted(ev)){
    return false;
  }

  const start=
    eventDate(ev).getTime();

  if(!start){
    return false;
  }

  return Date.now()-start <=
    team.recentFinalHours*3600000;
}


function statusText(ev){
  const s=
    ev?.competitions?.[0]?.status ||
    ev?.status ||
    {};

  const t=s.type||{};

  return (
    t.shortDetail ||
    t.detail ||
    s.displayClock ||
    ''
  );
}


function competitors(ev){
  return ev?.competitions?.[0]?.competitors || [];
}


function homeAwayTeams(ev){
  const comps=
    competitors(ev);

  const home=
    comps.find(
      c=>c.homeAway==='home'
    ) ||
    comps[0] ||
    {};

  const away=
    comps.find(
      c=>c.homeAway==='away'
    ) ||
    comps[1] ||
    {};

  return {
    home,
    away
  };
}


function opponentText(ev,teamId){
  const comps=
    competitors(ev);

  const own=
    comps.find(
      c=>String(c.team?.id)===
      String(teamId)
    );

  const opp=
    comps.find(
      c=>String(c.team?.id)!==
      String(teamId)
    );

  const name=
    opp?.team?.shortDisplayName ||
    opp?.team?.displayName ||
    opp?.team?.name ||
    'TBD';

  if(!own){
    return `vs ${name}`;
  }

  return own.homeAway==='away'
    ? `at ${name}`
    : `vs ${name}`;
}


function fmtTime(d){
  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone:TZ,
      hour:'numeric',
      minute:'2-digit'
    }
  ).format(d);
}


function fmtDate(d){
  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone:TZ,
      weekday:'short',
      month:'short',
      day:'numeric'
    }
  ).format(d);
}


function fmtShortDateTime(d){
  return new Intl.DateTimeFormat(
    'en-US',
    {
      timeZone:TZ,
      weekday:'short',
      hour:'numeric',
      minute:'2-digit'
    }
  ).format(d);
}


function networkOf(ev){
  if(ev?._resolvedNetwork){
    return ev._resolvedNetwork;
  }

  const comp=
    ev?.competitions?.[0] || {};

  const names=[];

  for(
    const b of comp.broadcasts || []
  ){
    for(
      const n of b.names || []
    ){
      if(n){
        names.push(n);
      }
    }
  }

  for(
    const b of ev?.broadcasts || []
  ){
    for(
      const n of b.names || []
    ){
      if(n){
        names.push(n);
      }
    }
  }

  return [...new Set(names)]
    .join(' / ') ||
    'TV TBD';
}


async function fallbackNetworkForEvent(
  team,
  event
){
  if(
    !event?.id ||
    networkOf(event)!=='TV TBD'
  ){
    return networkOf(event);
  }

  const key=
    `${team.sport}/${team.league}/${event.id}`;

  const hit=
    broadcastCache.get(key);

  if(
    hit &&
    Date.now()-hit.at <
    BROADCAST_CACHE_MS
  ){
    return hit.value;
  }

  try{
    const url=
      `${ESPN_BASE}/${team.sport}/${team.league}/summary?event=${event.id}`;

    const data=
      await fetchJson(url);

    const names=[];

    for(
      const h of data?.header?.competitions?.[0]?.broadcasts || []
    ){
      for(
        const n of h.names || []
      ){
        if(n){
          names.push(n);
        }
      }
    }

    const value=
      [...new Set(names)]
      .join(' / ') ||
      'TV TBD';

    broadcastCache.set(
      key,
      {
        at:Date.now(),
        value
      }
    );

    return value;

  }catch(e){

    broadcastCache.set(
      key,
      {
        at:Date.now(),
        value:'TV TBD'
      }
    );

    return 'TV TBD';
  }
}


async function fetchTeamBundle(team){
  const scheduleUrl=
    `${ESPN_BASE}/${team.sport}/${team.league}/teams/${team.teamId}/schedule`;

  const teamUrl=
    `${ESPN_BASE}/${team.sport}/${team.league}/teams/${team.teamId}`;

  let scheduleData=null;
  let teamData=null;

  try{
    [
      scheduleData,
      teamData
    ]=
    await Promise.all([
      fetchJson(scheduleUrl),
      fetchJson(teamUrl)
    ]);
  }catch(e){
    throw e;
  }

  const events=
    scheduleData?.events || [];

  const logo=
    teamData?.team?.logos?.[0]?.href ||
    team.fallbackLogo;

  const record=
    teamData?.team?.record?.items?.[0]?.summary ||
    teamData?.team?.recordSummary ||
    '';

  const candidates=
    events.filter(
      ev=>
        isSaneLive(ev) ||
        finalStillRelevant(ev,team) ||
        isEligibleUpcoming(ev,team)
    );

  for(
    const ev of candidates.slice(0,3)
  ){
    if(networkOf(ev)==='TV TBD'){
      ev._resolvedNetwork=
        await fallbackNetworkForEvent(
          team,
          ev
        );
    }
  }

  return {
    team,
    events,
    logo,
    record
  };
}


function chooseDisplayEvent(bundle){
  const {
    team,
    events
  }=bundle;

  const live=
    events
      .filter(isSaneLive)
      .sort(
        (a,b)=>
          eventDate(a)-eventDate(b)
      )[0];

  if(live){
    return {
      ev:live,
      kind:'live'
    };
  }

  const recent=
    events
      .filter(
        e=>finalStillRelevant(e,team)
      )
      .sort(
        (a,b)=>
          eventDate(b)-eventDate(a)
      )[0];

  if(recent){
    return {
      ev:recent,
      kind:'final'
    };
  }

  const upcoming=
    events
      .filter(
        e=>isEligibleUpcoming(e,team)
      )
      .sort(
        (a,b)=>
          eventDate(a)-eventDate(b)
      )[0];

  if(upcoming){
    return {
      ev:upcoming,
      kind:'upcoming'
    };
  }

  return null;
}


function makeFavoriteCard(bundle){
  const chosen=
    chooseDisplayEvent(bundle);

  if(!chosen){
    return null;
  }

  const {
    team:t,
    logo,
    record
  }=bundle;

  const ev=
    chosen.ev;

  const {
    home,
    away
  }=
    homeAwayTeams(ev);

  const isLive=
    chosen.kind==='live';

  const own=
    competitors(ev)
      .find(
        c=>
          String(c.team?.id)===
          String(t.teamId)
      );

  const opp=
    competitors(ev)
      .find(
        c=>
          String(c.team?.id)!==
          String(t.teamId)
      );

  const oppName=
    opp?.team?.shortDisplayName ||
    opp?.team?.displayName ||
    opp?.team?.name ||
    'TBD';

  let badge='';
  let match='';
  let headline='';
  let detail='';

  if(chosen.kind==='live'){

    badge='● LIVE';

    match=
      own?.homeAway==='away'
        ? `at ${oppName}`
        : `vs ${oppName}`;

    const ownScore=
      scoreValue(own);

    const oppScore=
      scoreValue(opp);

    headline=
      `${ownScore} – ${oppScore}`;

    detail=
      statusText(ev) ||
      'Live';

  }else if(chosen.kind==='final'){

    badge='FINAL';

    match=
      own?.homeAway==='away'
        ? `at ${oppName}`
        : `vs ${oppName}`;

    const ownScore=
      scoreValue(own);

    const oppScore=
      scoreValue(opp);

    headline=
      `${ownScore} – ${oppScore}`;

    detail=
      fmtDate(
        eventDate(ev)
      );

  }else{

    badge=
      isTodayInIndy(
        eventDate(ev)
      )
        ? 'TODAY'
        : 'NEXT';

    match=
      own?.homeAway==='away'
        ? `at ${oppName}`
        : `vs ${oppName}`;

    headline=
      fmtTime(
        eventDate(ev)
      );

    detail=
      fmtDate(
        eventDate(ev)
      );
  }

  return {
    t,
    ev,
    kind:chosen.kind,
    isLive,
    logo,
    record,
    badge,
    match,
    headline,
    detail,
    network:
      networkOf(ev)
  };
}


function favoritePriority(c){
  let pts=0;

  if(c.kind==='live'){
    pts+=10000;
  }

  if(
    isTodayInIndy(
      eventDate(c.ev)
    )
  ){
    pts+=5000;
  }

  if(c.kind==='final'){
    pts+=3000;
  }

  if(
    isPostseasonEvent(c.ev)
  ){
    pts+=1800;
  }

  if(
    c.t.college &&
    c.t.sport==='football' &&
    isTodayInIndy(
      eventDate(c.ev)
    )
  ){
    pts+=2200;
  }

  const hours=
    Math.abs(
      eventDate(c.ev).getTime()-
      Date.now()
    ) /
    3600000;

  pts+=
    Math.max(
      0,
      500-hours
    );

  return pts;
}

function renderOnDeck(
  bundles,
  allCards,
  displayedCards
){
  const list=
    document.getElementById(
      'comingList'
    );

  const note=
    document.getElementById(
      'onDeckNote'
    );

  list.innerHTML='';

  const displayedEvents=
    new Set(
      displayedCards.map(
        c=>String(
          c.ev?.id||''
        )
      )
    );

  const items=[];
  const seen=new Set();


  /*
    FIRST PRIORITY:
    Teams that qualified for Favorites
    but lost the six-card traffic jam.
  */

  for(
    const c of allCards.slice(6)
  ){
    const id=
      `${c.t.key}:` +
      `${c.ev?.id||eventDate(c.ev).getTime()}`;

    if(seen.has(id)){
      continue;
    }

    seen.add(id);

    items.push({
      type:'overflow',
      t:c.t,
      e:c.ev,
      kind:c.kind,
      isLive:c.isLive
    });
  }


  /*
    SECOND PRIORITY:
    Additional upcoming games for every favorite.

    The same TEAM may appear above and here.
    The same EVENT may not.

    Example:
      Favorites = Yankees today
      On Deck = Yankees tomorrow
  */

  const now=
    Date.now();

  const week=
    now +
    7*86400000;

  const upcoming=[];

  for(
    const b of bundles
  ){

    for(
      const e of b.events
    ){

      const when=
        eventDate(e)
        .getTime();

      if(
        isCompleted(e) ||
        isSaneLive(e) ||
        when<now-3600000 ||
        when>week
      ){
        continue;
      }

      if(
        displayedEvents.has(
          String(e.id||'')
        )
      ){
        continue;
      }

      const id=
        `${b.team.key}:` +
        `${e.id||when}`;

      if(seen.has(id)){
        continue;
      }

      seen.add(id);

      upcoming.push({
        type:'upcoming',
        t:b.team,
        e,
        kind:'upcoming',
        isLive:false
      });
    }
  }


  upcoming.sort(
    (a,b)=>
      eventDate(a.e)-
      eventDate(b.e)
  );

  items.push(
    ...upcoming
  );


  if(!items.length){

    note.textContent=
      'Looking ahead';

    list.innerHTML=
      '<div class="phaseMsg">' +
      'Nothing else scheduled for your teams in the next seven days.' +
      '</div>';

    return;
  }


  const overflowCount=
    allCards.length>6
      ? allCards.length-6
      : 0;


  note.textContent=
    overflowCount>0
      ? 'Overflow · Next seven days'
      : 'Next seven days';


  for(
    const x of items.slice(0,7)
  ){

    const d=
      eventDate(x.e);

    const div=
      document.createElement(
        'div'
      );

    div.className=
      'comingItem';


    let left='';

    if(x.kind==='live'){
      left='LIVE';

    }else if(x.kind==='final'){
      left='FINAL';

    }else{

      left=
        new Intl.DateTimeFormat(
          'en-US',
          {
            timeZone:TZ,
            weekday:'short'
          }
        )
        .format(d)
        .toUpperCase();
    }


    const sub=
      x.kind==='live'
        ? statusText(x.e)
        : (
            x.kind==='final'
              ? `${statusText(x.e)} · ${fmtShortDateTime(d)}`
              : fmtShortDateTime(d)
          );


    div.innerHTML=`

      <div class="comingTime">
        ${left}
      </div>

      <div>

        <div class="comingTeams">
          ${x.t.name}
          ${opponentText(x.e,x.t.teamId)}
        </div>

        <div class="tiny">
          ${sub}
        </div>

      </div>

      <div class="comingNetwork">
        ${networkOf(x.e)}
      </div>
    `;


    list.appendChild(div);
  }
}


function aroundStatusRank(g){

  if(g.state==='live'){
    return 0;
  }

  if(g.state==='pre'){
    return 1;
  }

  return 2;
}


function normalizeEspnAround(
  event,
  leagueLabel
){

  const c=
    event?.competitions?.[0] ||
    {};

  const comps=
    c.competitors ||
    [];

  const home=
    comps.find(
      x=>x.homeAway==='home'
    ) ||
    comps[0] ||
    {};

  const away=
    comps.find(
      x=>x.homeAway==='away'
    ) ||
    comps[1] ||
    {};

  const st=
    c.status?.type ||
    event?.status?.type ||
    {};

  const state=
    st.state==='in'
      ? 'live'
      : (
          st.completed ||
          st.state==='post'
            ? 'post'
            : 'pre'
        );


  const rank=x=>{

    const r=
      Number(
        x?.curatedRank?.current ||
        x?.team?.rank ||
        0
      ) ||
      0;

    return (
      /^NCAA/.test(
        leagueLabel
      ) &&
      r>=1 &&
      r<=25
    )
      ? r
      : 0;
  };


  const score=x=>
    Number(
      scoreValue(x) ||
      0
    );


  return {
    source:'ESPN',
    league:leagueLabel,
    state,

    date:
      new Date(
        event.date ||
        c.date ||
        0
      ),

    away:
      away.team?.shortDisplayName ||
      away.team?.displayName ||
      away.team?.name ||
      'Away',

    home:
      home.team?.shortDisplayName ||
      home.team?.displayName ||
      home.team?.name ||
      'Home',

    awayScore:
      score(away),

    homeScore:
      score(home),

    awayRank:
      rank(away),

    homeRank:
      rank(home),

    status:
      st.shortDetail ||
      st.detail ||
      '',

    network:
      networkOf(event)
  };
}


function normalizeNcaaAround(
  wrapper,
  leagueLabel
){

  const g=
    wrapper?.game ||
    wrapper ||
    {};


  const toRank=v=>
    Number(v) ||
    0;


  const toScore=v=>
    Number(v) ||
    0;


  let dt=null;


  if(g.startTimeEpoch){
    dt=
      new Date(
        Number(g.startTimeEpoch)*
        1000
      );
  }


  if(
    !dt ||
    !dt.getTime()
  ){

    const raw=
      `${g.startDate||''} ${g.startTime||''}`
      .replace(
        / ET$/,
        ''
      );

    const trial=
      new Date(raw);

    if(trial.getTime()){
      dt=trial;
    }
  }


  return {

    source:'NCAA',
    league:leagueLabel,

    state:
      g.gameState==='live'
        ? 'live'
        : (
            g.gameState==='final'
              ? 'post'
              : 'pre'
          ),

    date:
      dt ||
      new Date(0),

    away:
      g.away?.names?.short ||
      g.away?.names?.full ||
      'Away',

    home:
      g.home?.names?.short ||
      g.home?.names?.full ||
      'Home',

    awayScore:
      toScore(
        g.away?.score
      ),

    homeScore:
      toScore(
        g.home?.score
      ),

    awayRank:
      toRank(
        g.away?.rank
      ),

    homeRank:
      toRank(
        g.home?.rank
      ),

    status:
      g.gameState==='live'
        ? `${g.currentPeriod||''}${g.contestClock ? ` · ${g.contestClock}`:''}`.trim()
        : (
            g.finalMessage ||
            g.startTime ||
            ''
          ),

    network:
      g.network ||
      'TV TBD'
  };
}


function aroundImportance(g){

  let pts=0;

  const now=
    Date.now();

  const hours=
    Math.abs(
      g.date.getTime()-
      now
    ) /
    3600000;


  if(g.state==='live'){

    pts+=100;

  }else if(g.state==='pre'){

    pts+=
      Math.max(
        0,
        45-hours*2
      );

  }else{

    pts+=8;
  }


  const ranked=
    (
      g.awayRank>0
        ? 1
        : 0
    ) +
    (
      g.homeRank>0
        ? 1
        : 0
    );


  pts+=ranked*18;


  if(
    g.awayRank>0 &&
    g.awayRank<=10
  ){
    pts+=9;
  }


  if(
    g.homeRank>0 &&
    g.homeRank<=10
  ){
    pts+=9;
  }


  if(g.state==='live'){

    const margin=
      Math.abs(
        g.awayScore-
        g.homeScore
      );


    if(margin<=3){

      pts+=25;

    }else if(margin<=7){

      pts+=16;

    }else if(margin<=14){

      pts+=7;
    }


    if(
      (
        g.awayRank &&
        g.homeScore>
        g.awayScore
      ) ||
      (
        g.homeRank &&
        g.awayScore>
        g.homeScore
      )
    ){
      pts+=14;
    }
  }


  if(
    /playoff|championship|wild card|tournament/i
    .test(
      g.status ||
      ''
    )
  ){
    pts+=20;
  }


  return pts;
}


function rankLabel(
  rank,
  name
){
  return rank
    ? `#${rank} ${name}`
    : name;
}


/*
  Around Sports logo handling.

  Pro sports use league logos.

  NCAA events look first for official
  sport-specific marks stored in the
  GitHub repo root:

    ncaa-football.png
    ncaa-mens-basketball.png
    ncaa-womens-basketball.png

  If one of those files has not yet
  been uploaded, the dashboard falls
  back automatically to the generic
  NCAA mark.
*/

function leagueLogoInfo(league){

  const key=
    String(
      league ||
      ''
    )
    .toUpperCase();


  if(key==='MLB'){

    return {
      src:
        'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png',

      fallback:'',
      label:'MLB'
    };
  }


  if(key==='NFL'){

    return {
      src:
        'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png',

      fallback:'',
      label:'NFL'
    };
  }


  if(key==='NBA'){

    return {
      src:
        'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png',

      fallback:'',
      label:'NBA'
    };
  }


  if(key==='WNBA'){

    return {
      src:
        'https://a.espncdn.com/i/teamlogos/leagues/500/wnba.png',

      fallback:'',
      label:'WNBA'
    };
  }


  const generic=
    'https://a.espncdn.com/i/teamlogos/leagues/500/ncaa.png';


  if(
    key.includes(
      'FOOTBALL'
    )
  ){

    return {
      src:'ncaa-football.png',
      fallback:generic,
      label:'NCAA Football'
    };
  }


  if(
    key.includes(
      'WOMEN'
    )
  ){

    return {
      src:'ncaa-womens-basketball.png',
      fallback:generic,
      label:'NCAA Women'
    };
  }


  if(
    key.includes(
      'MEN'
    )
  ){

    return {
      src:'ncaa-mens-basketball.png',
      fallback:generic,
      label:'NCAA Men'
    };
  }


  return {
    src:generic,
    fallback:'',
    label:'NCAA'
  };
}


function renderAroundGames(
  games,
  title
){

  document
    .getElementById(
      'aroundTitle'
    )
    .textContent=
      title;


  const list=
    document.getElementById(
      'gameList'
    );


  list.innerHTML='';


  if(!games.length){

    list.innerHTML=
      '<div class="phaseMsg">' +
      'Nothing compelling on the board right now.' +
      '</div>';

    return;
  }


  for(
    const g of games.slice(0,6)
  ){

    const d=
      document.createElement(
        'div'
      );


    d.className=
      `gameCard${g.state==='live'?' live':''}`;


    const teams=
      `${rankLabel(g.awayRank,g.away)} at ${rankLabel(g.homeRank,g.home)}`;


    let main='';


    if(
      g.state==='live' ||
      g.state==='post'
    ){

      main=
        `${g.awayScore} – ${g.homeScore}`;

    }else{

      main=
        fmtTime(
          g.date
        );
    }


    const context=
      g.state==='live'

        ? `<span class="aroundLive"><span class="liveDot"></span>LIVE</span> · ${g.status||g.league}`

        : (
            g.state==='post'

              ? `FINAL · ${g.league}`

              : `${g.league} · ${fmtShortDateTime(g.date)}`
          );


    const leagueLogo=
      leagueLogoInfo(
        g.league
      );


    const fallbackAttr=
      leagueLogo.fallback

        ? `data-fallback="${leagueLogo.fallback}"`

        : '';


    d.innerHTML=`

      <div class="leagueLogoWrap">

        <img
          class="leagueLogo"
          src="${leagueLogo.src}"
          ${fallbackAttr}
          alt="${leagueLogo.label}"
          onerror="
            if(
              this.dataset.fallback &&
              this.src!==this.dataset.fallback
            ){
              this.src=this.dataset.fallback;
              this.dataset.fallback='';
            }else{
              this.style.display='none';
              this.nextElementSibling.style.display='block';
            }
          "
        >

        <div class="leagueLogoFallback">
          ${leagueLogo.label}
        </div>

      </div>


      <div>

        <div class="gameTeams">
          ${teams}
        </div>

        <div class="gameContext">
          ${context}
        </div>

      </div>


      <div class="gameRight">

        <div class="gameScore">
          ${main}
        </div>

        <div class="gameNetwork">
          ${g.network||'TV TBD'}
        </div>

      </div>
    `;


    list.appendChild(d);
  }
}


async function fetchEspnAround(
  sport,
  league,
  label,
  dates
){

  const url=
    `${ESPN_BASE}/${sport}/${league}/scoreboard${dates?`?dates=${dates}`:''}`;


  const data=
    await fetchJson(url);


  return (
    data.events ||
    []
  )
  .map(
    e=>
      normalizeEspnAround(
        e,
        label
      )
  );
}


async function fetchNcaaToday(
  sport,
  division,
  label
){

  try{

    const data=
      await fetchJson(
        `${NCAA_BASE}/scoreboard/${sport}/${division}`
      );


    return (
      data.games ||
      []
    )
    .map(
      g=>
        normalizeNcaaAround(
          g,
          label
        )
    );

  }catch(e){

    return [];
  }
}


function espnDateString(
  d=new Date()
){

  const parts=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
      }
    )
    .formatToParts(d);


  const obj=
    Object.fromEntries(
      parts.map(
        p=>[
          p.type,
          p.value
        ]
      )
    );


  return (
    obj.year +
    obj.month +
    obj.day
  );
}


async function loadAroundSports(){

  const date=
    new Date();


  const dow=
    Number(
      new Intl.DateTimeFormat(
        'en-US',
        {
          timeZone:TZ,
          weekday:'short'
        }
      )
      .format(date)==='Sun'
    )
      ? 0
      : [
          'Sun',
          'Mon',
          'Tue',
          'Wed',
          'Thu',
          'Fri',
          'Sat'
        ]
        .indexOf(
          new Intl.DateTimeFormat(
            'en-US',
            {
              timeZone:TZ,
              weekday:'short'
            }
          )
          .format(date)
        );


  const dates=
    espnDateString(date);


  const jobs=[
    fetchEspnAround(
      'baseball',
      'mlb',
      'MLB',
      dates
    ),

    fetchEspnAround(
      'football',
      'nfl',
      'NFL',
      dates
    ),

    fetchEspnAround(
      'basketball',
      'nba',
      'NBA',
      dates
    ),

    fetchEspnAround(
      'basketball',
      'wnba',
      'WNBA',
      dates
    )
  ];


  if(dow===6){

    jobs.push(
      fetchNcaaToday(
        'football',
        'fbs',
        'NCAA Football'
      )
    );

  }else{

    jobs.push(
      fetchNcaaToday(
        'basketball-men',
        'd1',
        'NCAA Men'
      )
    );

    jobs.push(
      fetchNcaaToday(
        'basketball-women',
        'd1',
        'NCAA Women'
      )
    );
  }


  const settled=
    await Promise.allSettled(
      jobs
    );


  let games=[];


  for(
    const x of settled
  ){

    if(
      x.status==='fulfilled'
    ){
      games.push(
        ...x.value
      );
    }
  }


  games=
    games.filter(
      g=>{
        const age=
          (
            Date.now()-
            g.date.getTime()
          ) /
          3600000;

        if(g.state==='live'){
          return Math.abs(age) <=
            LIVE_SANITY_HOURS;
        }

        if(g.state==='post'){
          return age<=12;
        }

        return age>=-18 &&
          age<=6;
      }
    );


  games.sort(
    (a,b)=>{

      const liveA=
        a.state==='live'
          ? 1
          : 0;

      const liveB=
        b.state==='live'
          ? 1
          : 0;


      if(liveA!==liveB){
        return liveB-liveA;
      }


      const imp=
        aroundImportance(b)-
        aroundImportance(a);


      if(imp){
        return imp;
      }


      const state=
        aroundStatusRank(a)-
        aroundStatusRank(b);


      if(state){
        return state;
      }


      return a.date-b.date;
    }
  );


  let title=
    'Around Sports';


  if(dow===6){
    title=
      'College Football Saturday';

  }else if(dow===0){
    title=
      'NFL Sunday';
  }


  renderAroundGames(
    games,
    title
  );
}

function weatherAccent(code){

  if(code===0){
    return '232,190,88';
  }

  if(
    [1,2,3,45,48]
    .includes(code)
  ){
    return '151,181,205';
  }

  if(
    [
      51,53,55,
      56,57,
      61,63,65,
      66,67,
      80,81,82
    ]
    .includes(code)
  ){
    return '74,153,211';
  }

  if(
    [
      71,73,75,
      77,85,86
    ]
    .includes(code)
  ){
    return '176,220,239';
  }

  if(
    [95,96,99]
    .includes(code)
  ){
    return '150,123,213';
  }

  return '143,199,242';
}


function indyClockMinutes(){

  const parts=
    new Intl.DateTimeFormat(
      'en-US',
      {
        timeZone:TZ,
        hour:'2-digit',
        minute:'2-digit',
        hour12:false
      }
    )
    .formatToParts(
      new Date()
    );


  const o=
    Object.fromEntries(
      parts.map(
        p=>[
          p.type,
          p.value
        ]
      )
    );


  return (
    Number(o.hour)*60 +
    Number(o.minute)
  );
}


function isoLocalMinutes(str){

  const m=
    String(str||'')
    .match(
      /T(\d{2}):(\d{2})/
    );


  if(!m){
    return null;
  }


  return (
    Number(m[1])*60 +
    Number(m[2])
  );
}


async function loadWeather(){

  try{

    const url=
      'https://api.open-meteo.com/v1/forecast' +
      '?latitude=39.7684' +
      '&longitude=-86.1581' +
      '&current=temperature_2m,apparent_temperature,weather_code' +
      '&hourly=temperature_2m,precipitation_probability' +
      '&daily=sunrise,sunset' +
      '&temperature_unit=fahrenheit' +
      '&timezone=America%2FIndiana%2FIndianapolis' +
      '&forecast_days=2';


    const w=
      await fetchJson(url);


    const temp=
      Math.round(
        w.current.temperature_2m
      );


    const feels=
      Math.round(
        w.current.apparent_temperature
      );


    const code=
      Number(
        w.current.weather_code
      );


    const [
      icon,
      description
    ]=
      weatherDescription(code);


    document
      .getElementById(
        'weatherIcon'
      )
      .textContent=
        icon;


    document
      .getElementById(
        'weatherTemp'
      )
      .textContent=
        `${temp}°`;


    document
      .getElementById(
        'weatherCondition'
      )
      .textContent=
        `${description} · Feels ${feels}°`;


    document
      .getElementById(
        'weatherPanel'
      )
      .style
      .setProperty(
        '--weather-accent',
        weatherAccent(code)
      );


    const now=
      Date.now();


    const next=[];


    for(
      let i=0;
      i<w.hourly.time.length;
      i++
    ){

      const x=
        new Date(
          w.hourly.time[i]
        );


      if(
        x.getTime()>now
      ){

        next.push({

          t:
            Math.round(
              w.hourly.temperature_2m[i]
            ),

          p:
            Math.round(
              w.hourly.precipitation_probability[i] ||
              0
            ),

          d:x
        });
      }


      if(next.length>=3){
        break;
      }
    }


    const sunrise=
      w.daily?.sunrise?.[0];

    const sunset=
      w.daily?.sunset?.[0];


    const riseM=
      isoLocalMinutes(
        sunrise
      );

    const setM=
      isoLocalMinutes(
        sunset
      );


    const nowM=
      indyClockMinutes();


    const sunUp=
      riseM!==null &&
      setM!==null &&
      nowM>=riseM &&
      nowM<setM;


    const riseText=
      sunrise
        ? fmtTime(
            new Date(sunrise)
          )
        : '—';


    const setText=
      sunset
        ? fmtTime(
            new Date(sunset)
          )
        : '—';


    const hourly=
      next.map(
        x=>
          `${fmtTime(x.d)} ${x.t}° · ${x.p}%`
      );


    document
      .getElementById(
        'weatherDetails'
      )
      .innerHTML=`

        <div>
          ${hourly[0]||''}
        </div>

        <div>
          ${hourly[1]||''}
        </div>

        <div>
          ${hourly[2]||''}
        </div>

        <div class="sunLine">
          Sunrise ${riseText} · Sunset ${setText}
        </div>

        <div class="sunLine">
          ${sunUp ? '☀ SUN UP' : '☾ SUN DOWN'}
        </div>
      `;


  }catch(e){

    document
      .getElementById(
        'weatherDetails'
      )
      .textContent=
        'Weather temporarily unavailable';
  }
}

async function loadSports(){

  const status=
    document.getElementById(
      'favoritesStatus'
    );


  const settled=
    await Promise.allSettled(
      FAVORITES.map(
        fetchTeamBundle
      )
    );


  const good=
    settled
      .filter(
        x=>
          x.status==='fulfilled'
      )
      .map(
        x=>x.value
      );


  const cards=
    good
      .map(
        makeFavoriteCard
      )
      .filter(Boolean);


  cards.sort(
    (a,b)=>{

      if(
        a.isLive!==
        b.isLive
      ){
        return a.isLive
          ? -1
          : 1;
      }


      const p=
        favoritePriority(b)-
        favoritePriority(a);


      if(p){
        return p;
      }


      return (
        eventDate(a.ev)-
        eventDate(b.ev)
      );
    }
  );


  const displayed=
    cards.slice(0,6);


  renderTeamCards(
    cards
  );


  renderOnDeck(
    good,
    cards,
    displayed
  );


  const failed=
    settled.length-
    good.length;


  status.textContent=
    `${cards.length} active favorite${cards.length===1?'':'s'}` +
    `${cards.length>6?' · top 6 shown':''}` +
    (
      failed
        ? ` · ${failed} feed${failed===1?'':'s'} unavailable`
        : ''
    ) +
    ` · 7-day rule · football stays active in season`;
}
